<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL HRM STAF — MYCARPET PRO</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #f4f6f9; color: #333; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 450px; text-align: center; }
        h2 { color: #ff4b4b; margin-bottom: 8px; font-weight: 700; }
        .muted { color: #718096; font-size: 14px; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 14px; outline: none; }
        .form-control:focus { border-color: #ff4b4b; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; background: #ff4b4b; color: white; margin-top: 10px; transition: 0.2s; }
        .btn:hover { background: #d63f3f; }
        .hidden { display: none !important; }
        .status-box { background: #edf2f7; padding: 12px; border-radius: 8px; font-weight: bold; margin: 15px 0; color: #2d3748; }
        .btn-status { padding: 10px; border: none; border-radius: 6px; font-weight: bold; color: white; cursor: pointer; flex: 1; font-size: 13px; }
    </style>
</head>
<body onload="muatNamaStafDinamik()">

<div class="container">
    <!-- 🔑 KAD 1: HALAMAN LOG MASUK PEKERJA -->
    <div id="login-block">
        <h2>Kabin HRM Staf</h2>
        <p class="muted">Sila pilih nama untuk aktifkan sesi kerja terminal</p>
        <div class="form-group">
            <label>Pilih Nama Anda</label>
            <select id="staff-user" class="form-control">
                <option value="">-- Sedang memuat nama staf... --</option>
            </select>
        </div>
        <button class="btn" onclick="logMasukStaf()">Masuk Sesi Kerja</button>
    </div>

    <!-- 🧺 KAD 2: DASHBOARD TUGASAN IMBASAN -->
    <div id="dashboard-block" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <span style="font-weight:bold; color:green;"><i class="fa-solid fa-circle-user"></i> Staf: <span id="txt-staf-aktif"></span></span>
            <button onclick="logKeluarStaf()" style="background:none; border:none; color:red; font-weight:bold; cursor:pointer;"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
        </div>
        <hr style="margin-bottom:15px; border:0; height:1px; background:#e2e8f0;">
        
        <h4><i class="fa-solid fa-barcode"></i> Stesen Imbasan QR Pembantu</h4>
        <div id="qr-area" style="width:100%; margin-top:10px; border-radius:8px; overflow:hidden; background:#000;"></div>
        <p id="scan-status-text" style="margin-top:10px; font-weight:bold; color:#ff4b4b;">Sila benarkan kamera untuk mula mengimbas...</p>
        
        <div id="action-area" class="hidden" style="margin-top:20px; text-align:left;">
            <div class="status-box">QR Terbaca: <span id="txt-qr-terbaca" style="color:#ff4b4b;"></span></div>
            <label>Pilih Status Baharu Karpet ini:</label>
            <div style="display:flex; gap:10px; margin-top:8px;">
                <button class="btn-status" style="background:#f1c40f; color:black;" onclick="hantarStatusKeCloud('PENGERINGAN')">🟡 PENGERINGAN</button>
                <button class="btn-status" style="background:#3498db;" onclick="hantarStatusKeCloud('READY TO DELIVER')">🔵 READY DELIVER</button>
                <button class="btn-status" style="background:#28a745;" onclick="hantarStatusKeCloud('SELESAI DIHANTAR')">🟢 DIHANTAR</button>
            </div>
        </div>
    </div>
</div>

<script>
const WEB_APP_URL = "https://google.com"; 

var namaStafAktif = "";
var qrIdTerbaca = "";
let html5QrcodeScanner = null;

// ⭐ FUNGSI PINTAR BARU: Ambil data live dari Tab Pekerja Google Sheets
function muatNamaStafDinamik() {
    fetch(`${WEB_APP_URL}?action=getStaffNames`)
    .then(response => response.json())
    .then(data => {
        if (data.success && data.staffList.length > 0) {
            var dropdown = document.getElementById("staff-user");
            dropdown.innerHTML = '<option value="">-- Sila Pilih Nama Anda --</option>';
            data.staffList.forEach(function(staf) {
                dropdown.innerHTML += `<option value="${staf.nama}">${staf.nama} (${staf.peranan})</option>`;
            });
        } else {
            document.getElementById("staff-user").innerHTML = '<option value="">❌ Gagal muat data pekerja</option>';
        }
    })
    .catch(err => {
        document.getElementById("staff-user").innerHTML = '<option value="">❌ Ralat sambungan Cloud</option>';
    });
}

function logMasukStaf() {
    var nama = document.getElementById("staff-user").value;
    if(!nama) { alert("Sila pilih nama anda terlebih dahulu!"); return; }
    namaStafAktif = nama;
    document.getElementById("txt-staf-aktif").innerText = nama;
    document.getElementById("login-block").classList.add("hidden");
    document.getElementById("dashboard-block").classList.remove("hidden");
    mulakanKameraScanner();
}

function logKeluarStaf() {
    if(html5QrcodeScanner) { html5QrcodeScanner.stop(); html5QrcodeScanner = null; }
    namaStafAktif = "";
    document.getElementById("login-block").classList.remove("hidden");
    document.getElementById("dashboard-block").classList.add("hidden");
    document.getElementById("action-area").classList.add("hidden");
}

function mulakanKameraScanner() {
    document.getElementById("scan-status-text").innerText = "Membuka kamera live...";
    html5QrcodeScanner = new Html5Qrcode("qr-area");
    html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 20, qrbox: { width: 220, height: 220 }, aspectRatio: 1.0 },
        (decodedText) => {
            qrIdTerbaca = decodedText.trim().replace(/[\(\r\\)n\t]/g, "");
            document.getElementById("txt-qr-terbaca").innerText = qrIdTerbaca;
            document.getElementById("scan-status-text").innerText = "✓ QR dikesan! Sila klik butang status di bawah.";
            document.getElementById("action-area").classList.remove("hidden");
        },
        (errorMessage) => { }
    ).catch(err => {
        document.getElementById("scan-status-text").innerText = "Gagal akses kamera: " + err;
    });
}

function hantarStatusKeCloud(statusBaru) {
    if(!qrIdTerbaca || !namaStafAktif) return;
    if(!confirm("Sahkan penukaran status karpet " + qrIdTerbaca + " kepada " + statusBaru + "?")) return;
    
    document.getElementById("scan-status-text").innerText = "⏳ Sedang menghantar log ke cloud Excel...";
    
    fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            action: "updateStatusWithLog",
            qrId: qrIdTerbaca,
            status: statusBaru,
            staffNama: namaStafAktif
        })
    }).then(() => {
        alert("🎉 Berjaya! Status " + qrIdTerbaca + " ditukar kepada " + statusBaru);
        document.getElementById("action-area").classList.add("hidden");
        document.getElementById("scan-status-text").innerText = "Halakan kamera pada QR seterusnya...";
        qrIdTerbaca = "";
    }).catch(err => {
        alert("❌ Gagal hantar data. Sila semak internet.");
        document.getElementById("scan-status-text").innerText = "Ralat sambungan.";
    });
}
</script>
</body>
</html>
