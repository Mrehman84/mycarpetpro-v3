    <title>TERMINAL HRM STAF — MYCARPET PRO</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <!-- ENJIN INLINE KAMERA BEBAS SEKATAN -->

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #f4f6f9; color: #333; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 450px; text-align: center; }
        h2 { color: #ff4b4b; margin-bottom: 8px; font-weight: 700; }
        .muted { color: #718096; font-size: 14px; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 14px; outline: none; }
        .form-control:focus { border-color: #ff4b4b; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; background: #ff4b4b; color: white; margin-top: 10px; transition: 0.2s; }
        .btn:hover { background: #d63f3f; }
        .hidden { display: none !important; }
        .status-box { background: #edf2f7; padding: 12px; border-radius: 8px; font-weight: bold; margin: 15px 0; color: #2d3748; }
        .btn-status { padding: 10px; border: none; border-radius: 6px; font-weight: bold; color: white; cursor: pointer; flex: 1; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <!-- 🔑 KAD 1: LOG MASUK -->
    <div id="login-block">
        <h2>Kabin HRM Staf</h2>
        <p class="muted">Sila pilih nama untuk aktifkan sesi kerja terminal</p>
        <div class="form-group">
            <label>Pilih Nama Anda</label>
            <select id="staff-user" class="form-control">
                <option value="">-- Sila Pilih Nama Anda --</option>
                <option value="REHMAN">REHMAN</option>
                <option value="Eirfan">Eirfan</option>
                <option value="IMRAN">IMRAN</option>
                <option value="Eman">Eman</option>
            </select>
        </div>
        <button class="btn" onclick="logMasukStaf()">Masuk Sesi Kerja</button>
    </div>

    <!-- 🧺 KAD 2: DASHBOARD IMBASAN KAMERA -->
    <div id="dashboard-block" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <span style="font-weight:bold; color:green;"><i class="fa-solid fa-circle-user"></i> Staf: <span id="txt-staf-aktif"></span></span>
            <button onclick="logKeluarStaf()" style="background:none; border:none; color:red; font-weight:bold; cursor:pointer;"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
        </div>
        <hr style="margin-bottom:15px; border:0; height:1px; background:#e2e8f0;">
        
        <h4><i class="fa-solid fa-barcode"></i> Stesen Imbasan QR Pembantu</h4>
        <div id="qr-area" style="width:100%; margin-top:10px; border-radius:8px; overflow:hidden; background:#000; min-height:200px;"></div>
        <p id="scan-status-text" style="margin-top:10px; font-weight:bold; color:#ff4b4b;">Sila benarkan kamera untuk mula mengimbas...</p>
        
        <div id="action-area" class="hidden" style="margin-top:20px; text-align:left;">
            <div class="status-box">QR Terbaca: <span id="txt-qr-terbaca" style="color:#ff4b4b;"></span></div>
            <label>Pilih Status Baharu Karpet ini:</label>
            <div style="display:flex; gap:10px; margin-top:8px;">
                <button class="btn-status" style="background:#f1c40f; color:black;" onclick="hantarStatusKeCloud('PENGERINGAN')">🟡 PENGERINGAN</button>
                <button class="btn-status" style="background:#3498db;" onclick="hantarStatusKeCloud('READY TO DELIVER')">🔵 READY DELIVER</button>
                <button class="btn-status" style="background:#28a745;" onclick="hantarStatusKeCloud('SELESAI DIHANTAR')">🟢 DIHANTAR</button>
            </div>
        </div>
    </div>

    <!-- 🧺 KAD 3: MONITOR AMPAIAN KELOMPOK (BATCH UPDATE) -->
    <div id="batch-monitor-section" class="hidden" style="margin-top: 25px; text-align: left; border-top: 2px dashed #e2e8f0; padding-top: 20px;">
        <h3 style="color: #ff4b4b; font-size: 14px;"><i class="fa-solid fa-layer-group"></i> Kemaskini Kelompok & Monitor Hari</h3>
        <p style="font-size: 11px; color: #718096; margin-bottom: 12px;">Sistem auto-kira berapa hari karpet berada di ampaian.</p>
        
        <div style="background: #f7fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 15px;">
            <label style="font-size: 11px; font-weight: bold;">Tukar STATUS SEMUA Karpet Aktif Kepada:</label>
            <div style="display: flex; gap: 8px; margin-top: 6px;">
                <button class="btn-status" style="background:#f1c40f; color:black; padding:6px;" onclick="prosesBatchStatusManual('PENGERINGAN')">🟡 PENGERINGAN</button>
                <button class="btn-status" style="background:#3498db; padding:6px;" onclick="prosesBatchStatusManual('READY TO DELIVER')">🔵 READY DELIVER</button>
            </div>
        </div>

        <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; font-size: 11px;">
                <thead>
                    <tr style="background: #edf2f7; color: #4a5568; border-bottom: 2px solid #cbd5e0;">
                        <th style="padding: 6px; text-align: left;">QR ID</th>
                        <th style="padding: 6px; text-align: left;">Status</th>
                        <th style="padding: 6px; text-align: center;">Masa Ampaian</th>
                    </tr>
                </thead>
                <tbody id="tbody-live-monitor"></tbody>
            </table>
        </div>
    </div>
</div>
<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzkJQUkgumJICdEZ84GB0ajzQnPbVLLaA0_uCSKuGU-VgVaetTLZsZFdnZTbmMvx1LLbA/exec"; 

var namaStafAktif = "";
var qrIdTerbaca = "";
let html5QrcodeScanner = null;

function logMasukStaf() {
    var nama = document.getElementById("staff-user").value;
    if(!nama) { alert("Sila pilih nama anda terlebih dahulu!"); return; }
    namaStafAktif = nama;
    document.getElementById("txt-staf-aktif").innerText = nama;
    document.getElementById("login-block").classList.add("hidden");
    document.getElementById("dashboard-block").classList.remove("hidden");
    
    document.getElementById("batch-monitor-section").classList.remove("hidden");
    muatDataMonitorRakCloud();
    
    setTimeout(mulakanKameraScanner, 500);
}

function logKeluarStaf() {
    if(html5QrcodeScanner) { try { html5QrcodeScanner.stop(); } catch(e){} html5QrcodeScanner = null; }
    namaStafAktif = "";
    document.getElementById("login-block").classList.remove("hidden");
    document.getElementById("dashboard-block").classList.add("hidden");
    document.getElementById("action-area").classList.add("hidden");
    document.getElementById("batch-monitor-section").classList.add("hidden");
}

function mulakanKameraScanner() {
    document.getElementById("scan-status-text").innerText = "Membuka kamera live...";
    try {
        html5QrcodeScanner = new Html5Qrcode("qr-area");
        html5QrcodeScanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            function(decodedText) {
                qrIdTerbaca = decodedText.trim();
                document.getElementById("txt-qr-terbaca").innerText = qrIdTerbaca;
                document.getElementById("scan-status-text").innerText = "✓ QR dikesan! Sila klik butang status di bawah.";
                document.getElementById("action-area").classList.remove("hidden");
            }
        );
        document.getElementById("scan-status-text").innerText = "Sila halakan kamera telefon pada QR ID Karpet.";
    } catch(err) {
        document.getElementById("scan-status-text").innerText = "Gagal akses kamera: " + err;
    }
}

function muatDataMonitorRakCloud() {
    var tbody = document.getElementById("tbody-live-monitor");
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:10px; color:gray;">⏳ Menghitung hari ampaian...</td></tr>';
    
    fetch(`${WEB_APP_URL}?action=getTrackingHistory&qrId=ALL_ACTIVE`)
    .then(function(res) { return res.json(); })
    .then(function(data) {
        if (data.success && data.logs.length > 0) {
            var htmlResult = "";
            var hariIni = new Date();
            
            data.logs.forEach(function(log) {
                var paparanHari = "-";
                if (log.timestamp) {
                    var tarikhObjek = new Date(log.timestamp);
                    if (!isNaN(tarikhObjek.getTime())) {
                        var diffMasa = hariIni.getTime() - tarikhObjek.getTime();
                        var bezaHari = Math.floor(diffMasa / (1000 * 60 * 60 * 24));
                        
                        if (log.statusBaru === "PENGERINGAN") {
                            if (bezaHari >= 3) {
                                paparanHari = `<span style="background:#dc3545; color:white; padding:2px 6px; border-radius:10px; font-weight:bold;">⚠️ ${bezaHari} Hari</span>`;
                            } else {
                                paparanHari = `<span style="background:#ffc107; color:black; padding:2px 6px; border-radius:10px; font-weight:bold;">🕒 ${bezaHari} Hari</span>`;
                            }
                        }
                    }
                }
                
                htmlResult += `
                    <tr style="border-bottom: 1px solid #e2e8f0;">
                        <td style="padding: 8px;"><strong>${log.qrId}</strong></td>
                        <td style="padding: 8px;"><span style="font-size:11px;">${log.statusBaru}</span></td>
                        <td style="padding: 8px; text-align:center;">${paparanHari}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = htmlResult;
        } else {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:10px; color:red;">Tiada karpet aktif.</td></tr>';
        }
    })
    .catch(function(err) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:10px; color:red;">❌ Gagal memuatkan monitor rak.</td></tr>';
    });
}

function hantarStatusKeCloud(statusBaru) {
    if(!qrIdTerbaca || !namaStafAktif) return;
    if(!confirm("Sahkan penukaran status karpet " + qrIdTerbaca + " kepada " + statusBaru + "?")) return;
    
    document.getElementById("scan-status-text").innerText = "⏳ Sedang menghantar log ke cloud...";
    
    fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            action: "updateStatusWithLog",
            qrId: qrIdTerbaca,
            status: statusBaru,
            staffNama: namaStafAktif
        })
    }).then(function() {
        alert("🎉 Berjaya! Status " + qrIdTerbaca + " ditukar kepada " + statusBaru);
        document.getElementById("action-area").classList.add("hidden");
        document.getElementById("scan-status-text").innerText = "Halakan kamera pada QR seterusnya...";
        qrIdTerbaca = "";
        muatDataMonitorRakCloud();
    }).catch(function(err) {
        alert("❌ Ralat sambungan.");
    });
}

function prosesBatchStatusManual(statusBaru) {
    if (!namaStafAktif) return;
    if (!confirm(`Sahkan kemaskini KELOMPOK karpet aktif kepada status: ${statusBaru}?`)) return;
    
    document.getElementById("scan-status-text").innerText = "⏳ Memproses kemaskini kelompok...";
    
    fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            action: "updateStatusWithLog",
            qrId: "BATCH_ACTIVE_REF",
            status: statusBaru,
            staffNama: namaStafAktif + " (Batch)"
        })
    }).then(function() {
        alert("🎉 Berjaya mengemaskini kumpulan status karpet!");
        muatDataMonitorRakCloud();
    }).catch(function(err) {
        alert("❌ Ralat menghantar data.");
    });
}
</script>
</body>
</html>
