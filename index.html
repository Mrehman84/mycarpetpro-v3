<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYCARPET PRO v3.0</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS Utama -->
    <link rel="stylesheet" href="css/style.css">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
</head>
<body>

<!-- Loading Overlay -->
<div id="loadingOverlay">
    <div class="spinner"></div>
    <p style="margin-top:15px;font-weight:500;color:var(--text-muted)">Memuat data...</p>
</div>

<!-- ==================== LOGIN ==================== -->
<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <img src="assets/logo.png" alt="Logo" class="login-logo" onerror="this.style.display='none'">
        <h2>MYCARPET PRO</h2>
        <p class="muted">Sistem Pengurusan Cucian Karpet</p>

        <!-- Tab pilihan login -->
        <div class="login-tabs">
            <button class="login-tab active" data-role="admin">Admin</button>
            <button class="login-tab" data-role="customer">Pelanggan</button>
        </div>

        <!-- Form Admin -->
        <form id="loginFormAdmin" class="login-form active">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="adminUser" class="form-control" placeholder="admin" autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPass" class="form-control" placeholder="••••••" autocomplete="current-password">
            </div>
            <div class="form-group flex">
                <label style="margin:0;display:flex;align-items:center;gap:6px;">
                    <input type="checkbox" id="rememberMeAdmin"> Ingat Saya
                </label>
            </div>
            <button type="button" class="btn btn-primary w-full" onclick="loginAdmin()"><i class="fa-solid fa-lock-open"></i> Log Masuk</button>
        </form>

        <!-- Form Pelanggan -->
        <form id="loginFormCustomer" class="login-form">
            <div class="form-group">
                <label>Nombor Telefon</label>
                <input type="tel" id="custPhone" class="form-control" placeholder="60123456789">
            </div>
            <div class="form-group flex">
                <label style="margin:0;display:flex;align-items:center;gap:6px;">
                    <input type="checkbox" id="rememberMeCust"> Ingat Saya
                </label>
            </div>
            <button type="button" class="btn btn-success w-full" onclick="loginCustomer()"><i class="fa-solid fa-user-check"></i> Semak Status</button>
        </form>
        <div id="loginError" class="login-error hidden"></div>
    </div>
</div>

<!-- ==================== MAIN APP (disembunyikan sebelum login) ==================== -->
<div id="appContainer" class="app-container hidden">
    <!-- Sidebar -->
    <aside id="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-rug"></i>
            <span>MYCARPET<span class="brand-red">PRO</span></span>
        </div>
        <ul id="sidebarMenu" class="sidebar-menu">
            <!-- Menu akan dijana oleh auth.js -->
        </ul>
        <div class="sidebar-footer">
            <div class="menu-item" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Log Keluar</div>
        </div>
    </aside>

    <!-- Main Content -->
    <main>
        <!-- Semua tab akan diletak di sini, dimuatkan secara dinamik atau melalui fungsi render -->
        <div id="tabContainer"></div>
    </main>
</div>

<!-- Toast Container -->
<div id="toastContainer" class="toast-container"></div>

<!-- Library JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<!-- Aplikasi JS -->
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<!-- Modul-modul akan ditambah kemudian -->
</body>
</html>
