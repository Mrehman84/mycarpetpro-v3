<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYCARPET PRO v3.0</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --primary-red: #ff4b4b;
            --primary-dark: #1e1e2f;
            --sidebar-width: 270px;
            --bg-light: #f8f9fa;
            --text-dark: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --success: #2ecc71;
            --warning: #f1c40f;
            --info: #3498db;
            --radius: 10px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,.10), 0 2px 4px -1px rgba(0,0,0,.06);
            --orange: #ff6d00;
            --green: #28a745;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-light); color: var(--text-dark); min-height: 100vh; }
        #loadingOverlay {
            position: fixed; inset: 0; background: rgba(255,255,255,.92); z-index: 9999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        #loadingOverlay.active { display: flex; }
        .spinner {
            width: 50px; height: 50px; border: 5px solid var(--border-color);
            border-top-color: var(--primary-red); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Login */
        .login-screen {
            position: fixed; inset: 0; background: linear-gradient(135deg, #1e1e2f 0%, #2d2d44 100%);
            display: flex; align-items: center; justify-content: center; z-index: 10000;
        }
        .login-card {
            background: #fff; border-radius: 16px; padding: 40px 30px;
            width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .login-logo { height: 60px; margin-bottom: 10px; }
        .login-card h2 { font-size: 24px; font-weight: 700; color: var(--primary-dark); }
        .login-tabs {
            display: flex; margin: 20px 0; border-radius: 30px; overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .login-tab {
            flex: 1; padding: 10px; background: #f7fafc; border: none;
            cursor: pointer; font-weight: 600; font-size: 14px; transition: .2s;
        }
        .login-tab.active { background: var(--primary-red); color: #fff; }
        .login-form { display: none; }
        .login-form.active { display: block; }
        .login-form .form-group { margin-bottom: 16px; text-align: left; }
        .login-error {
            background: #ffe0e0; color: #c00; padding: 10px;
            border-radius: 6px; font-size: 13px; margin-top: 12px;
        }

        /* App */
        .app-container { display: flex; min-height: 100vh; }
        .app-container.hidden { display: none; }

        /* Sidebar */
        aside {
            width: var(--sidebar-width); background: var(--primary-dark); color: #fff;
            position: fixed; top: 0; bottom: 0; left: 0;
            display: flex; flex-direction: column; z-index: 100;
            transition: transform .3s; overflow-y: auto;
        }
        .sidebar-brand {
            padding: 24px 20px; font-size: 20px; font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,.1);
            display: flex; align-items: center; gap: 10px; color: var(--primary-red);
        }
        .sidebar-brand span { color: #fff; }
        .sidebar-brand .brand-red { color: var(--primary-red); }
        .sidebar-menu {
            list-style: none; padding: 16px 12px; display: flex;
            flex-direction: column; gap: 4px; flex: 1;
        }
        .menu-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; color: #a0aec0; text-decoration: none;
            border-radius: var(--radius); font-weight: 500; cursor: pointer;
            transition: .2s; font-size: 14px;
        }
        .menu-item i { width: 22px; font-size: 16px; text-align: center; }
        .menu-item:hover { background: rgba(255,255,255,.08); color: #fff; }
        .menu-item.active { background: var(--primary-red); color: #fff; }
        .sidebar-footer {
            padding: 16px 12px; border-top: 1px solid rgba(255,255,255,.1);
        }

        /* Main */
        main {
            margin-left: var(--sidebar-width); flex: 1; padding: 30px;
            width: calc(100% - var(--sidebar-width)); transition: .3s;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card {
            background: #fff; border-radius: var(--radius); padding: 24px;
            box-shadow: var(--shadow); margin-bottom: 24px; border: 1px solid var(--border-color);
        }
        .card-title {
            font-size: 18px; font-weight: 600; margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color); padding-bottom: 10px;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        .form-control {
            width: 100%; padding: 10px 14px; border: 1px solid var(--border-color);
            border-radius: var(--radius); font-size: 14px; outline: none;
            background: #fff; transition: border-color .2s;
        }
        .form-control:focus { border-color: var(--primary-red); }
        .row { display: flex; gap: 20px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 200px; }
        .btn {
            padding: 10px 20px; border: none; border-radius: var(--radius);
            font-weight: 600; cursor: pointer; display: inline-flex;
            align-items: center; justify-content: center; gap: 8px;
            font-size: 14px; transition: .2s; text-decoration: none;
        }
        .btn:hover { opacity: .85; transform: translateY(-1px); }
        .btn-primary { background: var(--primary-red); color: #fff; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-danger { background: #e53e3e; color: #fff; }
        .btn-whatsapp { background: #25D366; color: #fff; }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .w-full { width: 100%; }
        .hidden { display: none !important; }
        .muted { color: var(--text-muted); }
        .text-center { text-align: center; }
        .mt-16 { margin-top: 16px; }
        .flex { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        .metrics-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
            gap: 18px; margin-bottom: 30px;
        }
        .metric-card {
            background: #fff; padding: 20px; border-radius: var(--radius);
            box-shadow: var(--shadow); border-left: 5px solid var(--primary-red);
        }
        .metric-card h3 { font-size: 13px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
        .metric-card p { font-size: 28px; font-weight: 700; }

        .badge {
            padding: 4px 12px; border-radius: 20px; font-size: 11px;
            font-weight: 600; text-transform: uppercase; display: inline-block;
        }
        .badge-proses { background: #ffeeb2; color: #8a6500; }
        .badge-cuci { background: #ebf8ff; color: #2b6cb0; }
        .badge-ready { background: #e6fffa; color: #234e52; }
        .badge-selesai { background: #c6f6d5; color: #22543d; }

        .table-wrap { overflow-x: auto; }
        .data-table {
            width: 100%; border-collapse: collapse; font-size: 14px; min-width: 600px;
        }
        .data-table th {
            padding: 10px 12px; border-bottom: 2px solid var(--border-color);
            color: var(--text-muted); text-align: left; font-weight: 600;
        }
        .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        .data-table tr:hover { background: #f7fafc; }

        /* Toast */
        .toast-container {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; gap: 8px; z-index: 99999;
        }
        .toast {
            background: #333; color: #fff; padding: 12px 24px;
            border-radius: 30px; font-size: 14px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            animation: fadeInUp 0.3s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile */
        @media (max-width: 992px) {
            aside { transform: translateX(-100%); }
            body.sidebar-open aside { transform: translateX(0); }
            main { margin-left: 0; width: 100%; padding: 16px; }
            .mobile-menu { display: inline-flex; }
            .row { flex-direction: column; }
            .col { min-width: 0; }
            .metrics-grid { grid-template-columns: repeat(2,1fr); }
        }
        @media (max-width: 600px) {
            .metrics-grid { grid-template-columns: 1fr; }
        }
        .mobile-menu { display: none; }
        @media (max-width: 992px) { .mobile-menu { display: inline-flex; } }
    </style>
</head>
<body>

<!-- Loading Overlay -->
<div id="loadingOverlay">
    <div class="spinner"></div>
    <p style="margin-top:15px;font-weight:500;color:var(--text-muted)">Memuat data...</p>
</div>

<!-- ========== LOGIN ========== -->
<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <img src="assets/logo.png" alt="Logo" class="login-logo" onerror="this.style.display='none'">
        <h2>MYCARPET PRO v3.0</h2>
        <p class="muted">Sistem Pengurusan Cucian Karpet</p>

        <div class="login-tabs">
            <button class="login-tab active" data-role="admin">Admin</button>
            <button class="login-tab" data-role="customer">Pelanggan</button>
        </div>

        <form id="loginFormAdmin" class="login-form active">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="adminUser" class="form-control" placeholder="admin" autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPass" class="form-control" placeholder="••••••" autocomplete="current-password">
            </div>
            <div class="form-group flex">
                <label style="display:flex;align-items:center;gap:6px;">
                    <input type="checkbox" id="rememberMeAdmin"> Ingat Saya
                </label>
            </div>
            <button type="button" class="btn btn-primary w-full" onclick="loginAdmin()">
                <i class="fa-solid fa-lock-open"></i> Log Masuk
            </button>
        </form>

        <form id="loginFormCustomer" class="login-form">
            <div class="form-group">
                <label>Nombor Telefon</label>
                <input type="tel" id="custPhone" class="form-control" placeholder="60123456789">
            </div>
            <div class="form-group flex">
                <label style="display:flex;align-items:center;gap:6px;">
                    <input type="checkbox" id="rememberMeCust"> Ingat Saya
                </label>
            </div>
            <button type="button" class="btn btn-success w-full" onclick="loginCustomer()">
                <i class="fa-solid fa-user-check"></i> Semak Status
            </button>
        </form>
        <div id="loginError" class="login-error hidden"></div>
    </div>
</div>

<!-- ========== APP ========== -->
<div id="appContainer" class="app-container hidden">
    <aside id="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-rug"></i>
            <span>MYCARPET<span class="brand-red">PRO</span></span>
        </div>
        <ul id="sidebarMenu" class="sidebar-menu"></ul>
        <div class="sidebar-footer">
            <div class="menu-item" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Log Keluar</div>
        </div>
    </aside>

    <main>
        <button class="btn btn-secondary mobile-menu" onclick="toggleSidebar()" style="margin-bottom:15px;">
            <i class="fa-solid fa-bars"></i> Menu
        </button>
        <div id="tabContainer"></div>
    </main>
</div>

<!-- Toast Container -->
<div id="toastContainer" class="toast-container"></div>

<script>
// ==================== CONFIG & STATE ====================
const CONFIG = {
    GAS_API_URL: "https://script.google.com/macros/s/AKfycbyDZGqIqcloW_acpOe7MOYRHvG4neZK0oRiUP5-Cqq8K1oR2-RYOw-Icp6bBRL5yzX3/exec",
    ACTIVE_STATUSES: ["DALAM PROSES", "PENGERINGAN", "READY TO DELIVER", "SELESAI DIHANTAR"]
};

let STATE = {
    senaraiHarga: [],
    pelanggan: [],
    tempahan: [],
    karpet: [],
    payment: [],
    currentUser: null,
    isLoading: false
};

// ==================== HELPERS ====================
function $(s, c=document) { return c.querySelector(s); }
function $$(s, c=document) { return [...c.querySelectorAll(s)]; }
function getField(row, names, fallback="") {
    if (!row || typeof row !== 'object') return fallback;
    const norm = names.map(n => String(n).toUpperCase().trim());
    for (let key of Object.keys(row)) {
        if (norm.includes(String(key).toUpperCase().trim())) {
            const v = row[key];
            return (v !== undefined && v !== null) ? v : fallback;
        }
    }
    return fallback;
}
function getNumber(v) {
    const n = parseFloat(String(v || "0").replace(/[RM,]/g, '').trim());
    return isNaN(n) ? 0 : n;
}
function formatMoney(v) { return "RM " + getNumber(v).toFixed(2); }
function escapeHtml(t) { if (!t) return ''; return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function normalize(s) { return String(s || "").trim().toUpperCase(); }
function showLoading(show) {
    const el = $('#loadingOverlay');
    if (el) el.classList.toggle('active', show);
}
function getToday() { return new Date().toISOString().split('T')[0]; }
function formatDateMY(dateStr) {
    if (!dateStr) return '-';
    const parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr;
    return `${parts[2]}-${parts[1]}-${parts[0]}`;
}
function toast(msg) {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const div = document.createElement('div');
    div.className = 'toast';
    div.textContent = msg;
    container.appendChild(div);
    setTimeout(() => div.remove(), 3000);
}

// ==================== API ====================
function fetchData(callback) {
    if (STATE.isLoading) return;
    STATE.isLoading = true;
    showLoading(true);
    // Buang skrip JSONP lama
    $$('script[data-jsonp]').forEach(el => el.remove());
    const cbName = 'jsonp_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);
    const timeout = setTimeout(() => {
        cleanupJsonp(cbName);
        showLoading(false);
        STATE.isLoading = false;
        toast('Masa muat turun tamat. Sila cuba lagi.');
    }, 25000);

    window[cbName] = function(resp) {
        clearTimeout(timeout);
        STATE.isLoading = false;
        showLoading(false);
        try {
            if (resp && typeof resp === 'object') {
                STATE.senaraiHarga = Array.isArray(resp.senaraiHarga) ? resp.senaraiHarga : [];
                STATE.pelanggan = Array.isArray(resp.pelanggan) ? resp.pelanggan : [];
                STATE.tempahan = Array.isArray(resp.tempahan) ? resp.tempahan : [];
                STATE.karpet = Array.isArray(resp.karpet) ? resp.karpet : [];
                STATE.payment = Array.isArray(resp.payment) ? resp.payment : [];
                if (callback) callback();
                refreshAllUI();
            } else {
                toast('Data tidak sah diterima.');
            }
        } catch(e) {
            console.error(e);
            toast('Ralat memproses data.');
        } finally {
            cleanupJsonp(cbName);
        }
    };

    const script = document.createElement('script');
    script.id = cbName; script.dataset.jsonp = 'true';
    script.src = CONFIG.GAS_API_URL + '?action=readAll&callback=' + encodeURIComponent(cbName);
    script.onerror = function() {
        clearTimeout(timeout);
        showLoading(false);
        STATE.isLoading = false;
        cleanupJsonp(cbName);
        toast('Gagal hubungi Google Apps Script.');
    };
    document.body.appendChild(script);
}

function cleanupJsonp(name) {
    const el = document.getElementById(name); if (el) el.remove();
    try { delete window[name]; } catch(e) {}
}

// ==================== AUTH ====================
// Admin login sementara – nanti boleh ditukar ke data dari sheet ADMIN
const ADMIN_DUMMY = { username: 'Carpet2026', password: 'Carpet2026', nama: 'Admin MyCarpet' };

function loginAdmin() {
    const username = document.getElementById('adminUser').value.trim();
    const password = document.getElementById('adminPass').value.trim();
    if (!username || !password) {
        showLoginError('Sila isi username dan password.');
        return;
    }
    // Semak sama ada dengan data dummy atau dari sheet ADMIN (kalau sudah ada)
    const admin = STATE.admin ? STATE.admin.find(a => normalize(a.username) === normalize(username) && a.password === password) : null;
    if ((username === ADMIN_DUMMY.username && password === ADMIN_DUMMY.password) || admin) {
        STATE.currentUser = { role: 'admin', username: username, nama: admin ? admin.nama : ADMIN_DUMMY.nama };
        saveSession();
        afterLogin();
    } else {
        showLoginError('Username atau password salah.');
    }
}

function loginCustomer() {
    function loginCustomer() {
    // Bersihkan input: buang sengkang dan ruang
    const phone = document.getElementById('custPhone').value.trim().replace(/[- ]/g, '');
    if (!phone) {
        showLoginError('Sila masukkan nombor telefon.');
        return;
    }
    // Cari pelanggan – bandingkan selepas bersihkan kedua-dua nombor
    const cust = STATE.pelanggan.find(c => {
        const dbPhone = String(getField(c, ['TELEFON','NO TELEFON'])).replace(/[- ]/g, '');
        return normalize(dbPhone) === normalize(phone);
    });
    if (cust) {
        // ... biarkan yang lain tidak berubah ...
        saveSession();
        afterLogin();
    } else {
        showLoginError('Nombor telefon tidak dijumpai. Sila daftar di kedai.');
    }
}

function saveSession() {
    const remember = STATE.currentUser.role === 'admin' ?
        document.getElementById('rememberMeAdmin').checked :
        document.getElementById('rememberMeCust').checked;
    const storage = remember ? localStorage : sessionStorage;
    storage.setItem('mycarpet_user', JSON.stringify(STATE.currentUser));
}

function showLoginError(msg) {
    const el = document.getElementById('loginError');
    el.textContent = msg;
    el.classList.remove('hidden');
}

function afterLogin() {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appContainer').classList.remove('hidden');
    initApp();
}

function logout() {
    STATE.currentUser = null;
    localStorage.removeItem('mycarpet_user');
    sessionStorage.removeItem('mycarpet_user');
    document.getElementById('appContainer').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('adminUser').value = '';
    document.getElementById('adminPass').value = '';
    document.getElementById('custPhone').value = '';
    document.getElementById('loginError').classList.add('hidden');
}

// ==================== APP INIT & ROUTING ====================
function initApp() {
    renderSidebar();
    // Tarik data dari GAS, kemudian papar dashboard/default tab
    fetchData(() => {
        // callback dijalankan setelah data diterima
        const defaultTab = STATE.currentUser.role === 'admin' ? 'dashboard' : 'customer-portal';
        switchTab(defaultTab);
    });
}

function renderSidebar() {
    const menuContainer = document.getElementById('sidebarMenu');
    menuContainer.innerHTML = '';
    const role = STATE.currentUser.role;
    const menuItems = role === 'admin' ? [
        { id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard' },
        { id: 'temujanji', icon: 'fa-calendar-check', label: 'Temujanji' },
        { id: 'tempahan', icon: 'fa-file-invoice-dollar', label: 'Tempahan Baru' },
        { id: 'tracking', icon: 'fa-qrcode', label: 'Tracking' },
        { id: 'payment', icon: 'fa-money-bill-wave', label: 'Pembayaran' },
        { id: 'invoice', icon: 'fa-print', label: 'Invois & Resit' },
        { id: 'pelanggan', icon: 'fa-users', label: 'Pelanggan' },
        { id: 'laporan', icon: 'fa-chart-line', label: 'Laporan' },
        { id: 'inventori', icon: 'fa-boxes', label: 'Inventori' },
        { id: 'pekerja', icon: 'fa-people-group', label: 'Pekerja & Komisen' }
    ] : [
        { id: 'customer-portal', icon: 'fa-eye', label: 'Status Karpet Saya' }
    ];

    menuItems.forEach(item => {
        const li = document.createElement('li');
        li.className = 'menu-item';
        li.dataset.tab = item.id;
        li.innerHTML = `<i class="fa-solid ${item.icon}"></i> ${item.label}`;
        li.addEventListener('click', () => switchTab(item.id));
        menuContainer.appendChild(li);
    });
}

function switchTab(tabId) {
    $$('.menu-item').forEach(el => el.classList.remove('active'));
    const activeMenu = $(`.menu-item[data-tab="${tabId}"]`);
    if (activeMenu) activeMenu.classList.add('active');

    const container = document.getElementById('tabContainer');
    container.innerHTML = '';

    if (tabId === 'dashboard') renderDashboard(container);
    else if (tabId === 'customer-portal') renderCustomerPortal(container);
    else container.innerHTML = `<div class="card text-center"><h2>🛠️ Modul Akan Datang</h2><p>${escapeHtml(tabId)} akan dibina tidak lama lagi.</p></div>`;

    if (window.innerWidth <= 992) document.body.classList.remove('sidebar-open');
}

function refreshAllUI() {
    if (STATE.currentUser) {
        const currentTab = document.querySelector('.menu-item.active');
        if (currentTab) switchTab(currentTab.dataset.tab);
    }
}

// ==================== DASHBOARD ====================
function renderDashboard(container) {
    const proses = STATE.karpet.filter(k => normalize(getField(k,['STATUS'])) === 'DALAM PROSES').length;
    const kering = STATE.karpet.filter(k => normalize(getField(k,['STATUS'])) === 'PENGERINGAN').length;
    const ready = STATE.karpet.filter(k => normalize(getField(k,['STATUS'])) === 'READY TO DELIVER').length;
    const selesai = STATE.karpet.filter(k => ['SELESAI','SELESAI DIHANTAR'].includes(normalize(getField(k,['STATUS'])))).length;

    const html = `
        <header>
            <div><h1>Dashboard Operasi</h1><p class="muted">Data sebenar dari spreadsheet</p></div>
            <button class="btn btn-secondary" onclick="fetchData()"><i class="fa-solid fa-sync"></i> Refresh</button>
        </header>
        <div class="metrics-grid">
            <div class="metric-card" style="border-left-color:#f1c40f"><h3>Dalam Proses</h3><p>${proses}</p></div>
            <div class="metric-card" style="border-left-color:#3498db"><h3>Pengeringan</h3><p>${kering}</p></div>
            <div class="metric-card" style="border-left-color:#38b2ac"><h3>Ready Deliver</h3><p>${ready}</p></div>
            <div class="metric-card" style="border-left-color:#2ecc71"><h3>Selesai</h3><p>${selesai}</p></div>
        </div>
        <div class="card">
            <h3 class="card-title">Aktiviti Terkini</h3>
            <div class="table-wrap">
                <table class="data-table">
                    <thead><tr><th>QR ID</th><th>Invois</th><th>Jenis</th><th>Harga</th><th>Tarikh</th><th>Status</th></tr></thead>
                    <tbody>
                        ${STATE.karpet.slice(-10).reverse().map(k => {
                            const st = normalize(getField(k,['STATUS']));
                            const badge = st==='READY TO DELIVER'?'badge-ready':
                                          (st==='SELESAI'||st==='SELESAI DIHANTAR')?'badge-selesai':
                                          st==='PENGERINGAN'?'badge-cuci':'badge-proses';
                            return `<tr>
                                <td><strong>${escapeHtml(getField(k,['QR ID','QR_ID']))}</strong></td>
                                <td>${escapeHtml(getField(k,['INV NO','INV_NO']))}</td>
                                <td>${escapeHtml(getField(k,['JENIS','JENIS CARPET']))}</td>
                                <td>${formatMoney(getField(k,['HARGA']))}</td>
                                <td>${escapeHtml(String(getField(k,['TARIKH'],'')).split('T')[0]||'-')}</td>
                                <td><span class="badge ${badge}">${escapeHtml(st)}</span></td>
                            </tr>`;
                        }).join('') || '<tr><td colspan="6" class="text-center muted">Tiada rekod</td></tr>'}
                    </tbody>
                </table>
            </div>
        </div>
    `;
    container.innerHTML = html;
}

// ==================== CUSTOMER PORTAL ====================
function renderCustomerPortal(container) {
    const custId = STATE.currentUser.customerId;
    const invNos = STATE.tempahan
        .filter(o => normalize(getField(o,['CUSTOMER ID','CUSTOMER_ID'])) === normalize(custId))
        .map(o => normalize(getField(o,['INV NO','INV_NO','NO INVOIS'])));
    const carpets = STATE.karpet.filter(k => invNos.includes(normalize(getField(k,['INV NO','INV_NO']))));
    const html = `
        <header>
            <div><h1>Status Karpet Saya</h1><p class="muted">Nombor Telefon: ${escapeHtml(STATE.currentUser.telefon)}</p></div>
        </header>
        <div class="card">
            ${carpets.length ? `
                <div class="table-wrap">
                    <table class="data-table">
                        <thead><tr><th>QR ID</th><th>Invois</th><th>Jenis</th><th>Harga</th><th>Tarikh</th><th>Status</th></tr></thead>
                        <tbody>
                            ${carpets.map(k => {
                                const st = normalize(getField(k,['STATUS']));
                                const badge = st==='READY TO DELIVER'?'badge-ready':
                                              (st==='SELESAI'||st==='SELESAI DIHANTAR')?'badge-selesai':
                                              st==='PENGERINGAN'?'badge-cuci':'badge-proses';
                                return `<tr>
                                    <td><strong>${escapeHtml(getField(k,['QR ID','QR_ID']))}</strong></td>
                                    <td>${escapeHtml(getField(k,['INV NO','INV_NO']))}</td>
                                    <td>${escapeHtml(getField(k,['JENIS','JENIS CARPET']))}</td>
                                    <td>${formatMoney(getField(k,['HARGA']))}</td>
                                    <td>${escapeHtml(String(getField(k,['TARIKH'],'')).split('T')[0]||'-')}</td>
                                    <td><span class="badge ${badge}">${escapeHtml(st)}</span></td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            ` : '<p class="muted">Anda tiada karpet dalam sistem.</p>'}
        </div>
    `;
    container.innerHTML = html;
}

// ==================== GLOBAL EVENTS ====================
function toggleSidebar() { document.body.classList.toggle('sidebar-open'); }

document.addEventListener('DOMContentLoaded', function() {
    // Tab login
    document.querySelectorAll('.login-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            const role = this.dataset.role;
            document.getElementById('loginFormAdmin').classList.toggle('active', role === 'admin');
            document.getElementById('loginFormCustomer').classList.toggle('active', role === 'customer');
            document.getElementById('loginError').classList.add('hidden');
        });
    });

    // Check session
    const stored = localStorage.getItem('mycarpet_user') || sessionStorage.getItem('mycarpet_user');
    if (stored) {
        try {
            STATE.currentUser = JSON.parse(stored);
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            initApp();
        } catch(e) { console.error(e); }
    }
});

document.addEventListener('click', function(e) {
    if (window.innerWidth <= 992 && !e.target.closest('aside') && !e.target.closest('.mobile-menu')) {
        document.body.classList.remove('sidebar-open');
    }
});
</script>
</body>
