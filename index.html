<script>
    
 // ================================================================
//   BAHAGIAN 2A - KONFIGURASI, HELPERS, API, AUTH, INIT, SIDEBAR
// ================================================================

// ==================== CONFIG & STATE ====================
const CONFIG = {
    GAS_API_URL: "https://script.google.com/macros/s/AKfycbxB8-ENhS_pe4I1Uw5ulQZA-fiXJ2hBbIIKI_yOel_5OwG1YGEof6k1TILpVP0OOlMd/exec",
    FINANCE_GAS_URL: "https://script.google.com/macros/s/AKfycbyJ2T-3MApoYIAjwLcOo4xLHV2h6CGzOOGmCkMa8J-17jhmh2n3UBp7_jhhoIeJzhO8oA/exec",
    ACTIVE_STATUSES: ["DALAM PROSES", "PENGERINGAN", "READY TO DELIVER", "SELESAI DIHANTAR"]
};
let STATE = {
    senaraiHarga: [], pelanggan: [], tempahan: [], karpet: [], payment: [],
    pekerja: [], komisen: [], runnerTugasan: [], expenses: [], rawExpenses: [],
    currentUser: null, isLoading: false, lastCustomer: null, lastOrderMsg: '',
    paymentWhatsAppMsg: '', paymentWhatsAppTel: '',
    offlineQueue: [], currentInvoiceData: null
};

// ==================== HELPERS ====================
function $(s, c=document) { return c.querySelector(s); }
function $$(s, c=document) { return [...c.querySelectorAll(s)]; }
function getField(row, names, fallback="") {
    if (!row || typeof row !== 'object') return fallback;
    const norm = names.map(n => String(n).toUpperCase().trim());
    for (let key of Object.keys(row)) {
        if (norm.includes(String(key).toUpperCase().trim())) {
            const v = row[key];
            return (v !== undefined && v !== null) ? v : fallback;
        }
    }
    return fallback;
}
function getNumber(v) {
    const n = parseFloat(String(v || "0").replace(/[RM,]/g, '').trim());
    return isNaN(n) ? 0 : n;
}
function formatMoney(v) { return "RM " + getNumber(v).toFixed(2); }
function escapeHtml(t) { if (!t) return ''; return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function normalize(s) { return String(s || "").trim().toUpperCase(); }
function showLoading(show) { const el = $('#loadingOverlay'); if (el) el.classList.toggle('active', show); }
function getToday() { return new Date().toISOString().split('T')[0]; }
function addDays(date, days) { const d = new Date(date); d.setDate(d.getDate() + days); return d.toISOString().split('T')[0]; }
function formatDateMY(dateStr) {
    if (!dateStr) return '-';
    const parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr;
    return `${parts[2]}-${parts[1]}-${parts[0]}`;
}
function toast(msg) {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const div = document.createElement('div'); div.className = 'toast'; div.textContent = msg;
    container.appendChild(div);
    setTimeout(() => div.remove(), 3000);
}
function bukaWhatsApp(phone, message) {
    if (!phone) return;
    const clean = String(phone).replace(/\D/g, '').replace(/^0+/, '');
    const waNumber = clean.startsWith('60') ? clean : '60' + clean;
    const url = `https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank');
}

// ==================== API (JSONP UNTUK BACA) ====================
function fetchData(callback, skipRefresh = false) {
    if (STATE.isLoading) return;
    STATE.isLoading = true;
    showLoading(true);
    $$('script[data-jsonp]').forEach(el => el.remove());
    const cbName = 'jsonp_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);
    const timeout = setTimeout(() => {
        cleanupJsonp(cbName); showLoading(false); STATE.isLoading = false;
        toast('Masa muat turun tamat.');
    }, 25000);
    window[cbName] = function(resp) {
        clearTimeout(timeout);
        STATE.isLoading = false;
        showLoading(false);
        try {
            if (resp && typeof resp === 'object') {
                STATE.senaraiHarga = Array.isArray(resp.senaraiHarga) ? resp.senaraiHarga : [];
                STATE.pelanggan = Array.isArray(resp.pelanggan) ? resp.pelanggan : [];
                STATE.tempahan = Array.isArray(resp.tempahan) ? resp.tempahan : [];
                STATE.karpet = Array.isArray(resp.karpet) ? resp.karpet : [];
                STATE.payment = Array.isArray(resp.payment) ? resp.payment : [];
                STATE.pekerja = Array.isArray(resp.pekerja) ? resp.pekerja : [];
                STATE.komisen = Array.isArray(resp.komisen) ? resp.komisen : [];
                STATE.runnerTugasan = Array.isArray(resp.runnerTugasan) ? resp.runnerTugasan : [];
                STATE.expenses = Array.isArray(resp.Raw_Expenses) ? resp.Raw_Expenses : [];
                STATE.rawExpenses = STATE.expenses;

                if (callback) callback();
                if (!skipRefresh) refreshAllUI();
            } else { toast('Data tidak sah.'); }
        } catch(e) { console.error(e); toast('Ralat memproses data.'); }
        finally { cleanupJsonp(cbName); }
    };
    const script = document.createElement('script');
    script.id = cbName; script.dataset.jsonp = 'true';
    script.src = CONFIG.GAS_API_URL + '?action=readAll&callback=' + encodeURIComponent(cbName);
    script.onerror = function() {
        clearTimeout(timeout); showLoading(false); STATE.isLoading = false;
        cleanupJsonp(cbName); toast('Gagal hubungi GAS.');
    };
    document.body.appendChild(script);
}

async function postData(data) {
  try {
    const response = await fetch(CONFIG.GAS_API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

  } catch (e) {

// ==================== OFFLINE QUEUE ====================
function saveToOfflineQueue(qrIds, status) {
    let queue = JSON.parse(localStorage.getItem('mycarpet_offline_queue') || '[]');
    queue.push({ qrIds, status, timestamp: new Date().toISOString() });
    localStorage.setItem('mycarpet_offline_queue', JSON.stringify(queue));
    STATE.offlineQueue = queue;
}
function loadOfflineQueue() {
    const stored = localStorage.getItem('mycarpet_offline_queue');
    if (stored) {
        STATE.offlineQueue = JSON.parse(stored);
        if (STATE.offlineQueue.length > 0) {
            toast('Ada ' + STATE.offlineQueue.length + ' data tertunda. Cuba sync...');
            processOfflineQueue();
        }
    }
}
async function processOfflineQueue() {
    if (STATE.offlineQueue.length === 0) return;
    if (!navigator.onLine) {
        toast('Tiada internet. Data akan dihantar kemudian.');
        return;
    }
    const queue = STATE.offlineQueue;
    const newQueue = [];
    for (let item of queue) {
        try {
            await postData({ action: 'updateBatchStatus', qrIds: item.qrIds, status: item.status });
        } catch (e) {
            newQueue.push(item);
        }
    }
    if (newQueue.length !== queue.length) {
        localStorage.setItem('mycarpet_offline_queue', JSON.stringify(newQueue));
        STATE.offlineQueue = newQueue;
        toast('Sync selesai. ' + (queue.length - newQueue.length) + ' data dihantar.');
        refreshAllUI();
    } else {
        toast('Sync gagal. Cuba lagi nanti.');
    }
}
window.addEventListener('online', () => {
    if (STATE.offlineQueue && STATE.offlineQueue.length > 0) processOfflineQueue();
});

function loginCustomer() {
    let phoneInput = document.getElementById('custPhone').value.trim().replace(/[^0-9]/g, '');
    if (!phoneInput) { showLoginError('Sila masukkan nombor telefon.'); return; }
    if (phoneInput.startsWith('0')) phoneInput = '60' + phoneInput.substring(1);
    else if (!phoneInput.startsWith('60')) phoneInput = '60' + phoneInput;
    const cust = STATE.pelanggan.find(c => {

        let cleanDbPhone = String(dbPhone).replace(/[^0-9]/g, '');
        if (cleanDbPhone.startsWith('0')) cleanDbPhone = '60' + cleanDbPhone.substring(1);

        return cleanDbPhone === phoneInput;

function qcImageSelected(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        document.getElementById('qcImagePreview').src = ev.target.result;
        document.getElementById('qcImagePreview').style.display = 'block';
    };
    reader.readAsDataURL(file);
}

function hantarQcWhatsApp() {
    const nama = document.getElementById('custNama').value || document.getElementById('custNamaBaru').value || 'Pelanggan';
    const tel = document.getElementById('custTel').value || document.getElementById('custTelBaru').value || '';
    if (!tel) { toast('Sila pilih pelanggan dahulu.'); return; }
    let kerosakan = [];
    if (document.getElementById('qcLuntur').checked) kerosakan.push('Warna Luntur');
    if (document.getElementById('qcKoyak').checked) kerosakan.push('Tepi Koyak');
    if (document.getElementById('qcBulu').checked) kerosakan.push('Bulu Gugur');
    const nota = document.getElementById('qcNota').value.trim();
    let msg = `🔍 *PEMERIKSAAN KUALITI (QC)*\n\nKami dapati kerosakan berikut pada karpet anda:\n`;
    if (kerosakan.length) msg += kerosakan.map(k => `• ${k}`).join('\n') + '\n';
    if (nota) msg += `Nota: ${nota}\n`;
    msg += `\nSila sahkan sama ada kami teruskan basuhan. Terima kasih.`;
    bukaWhatsApp(tel, msg);
}

function toggleCustType() {
    const baru = document.querySelector('input[name="custType"]:checked').value === 'baru';
    document.getElementById('secCustLama').style.display = baru ? 'none' : 'block';
    document.getElementById('secCustBaru').style.display = baru ? 'block' : 'none';
}

function loadCustomerDetails() {
    const id = document.getElementById('optPelanggan').value;
    const c = STATE.pelanggan.find(p => String(getField(p, ['CUSTOMER ID','CUSTOMER_ID'])).trim() === id);
    if (!c) { ['custNama','custTel','custAlamat','custDaerah'].forEach(f => document.getElementById(f).value = ''); return; }
    document.getElementById('custNama').value = getField(c, ['NAMA'], '');
    document.getElementById('custTel').value = getField(c, ['TELEFON','NO TELEFON'], '');
    document.getElementById('custAlamat').value = getField(c, ['ALAMAT'], '');
    document.getElementById('custDaerah').value = getField(c, ['DAERAH'], '');
}

function handleCodeSelection(rowId) {
    const row = document.getElementById(rowId);
    if (!row) return;
    const sel = row.querySelector('.select-kod-karpet');
    const price = row.querySelector('.inp-harga-final');
    const customContainer = row.querySelector('.box-custom-container');

    const isCustom = (sel && sel.value === 'CUSTOM');
    if (customContainer) {
        customContainer.style.display = isCustom ? 'block' : 'none';
    }
    if (price) {
        price.dataset.isManualOverride = "false";
    }
    if (isCustom) {
        const selMod = row.querySelector('.select-mod-custom-kira');
        if (selMod) selMod.value = 'HARGA_TERUS';
        row.querySelector('.seksyen-custom-harga-terus').style.display = 'block';
        row.querySelector('.seksyen-custom-kira-sqft').style.display = 'none';
        price.value = '0.00';
        handleCustomCalculation(rowId);
        return;
    }

    const opt = sel.options[sel.selectedIndex];
    const info = row.querySelector('.jenis-vlookup-info');
    if (opt && opt.dataset.harga) {
        const harga = parseFloat(opt.dataset.harga);
        price.value = harga.toFixed(2);
        info.innerHTML = `<strong>${escapeHtml(opt.dataset.jenis)}</strong><br>Harga: ${formatMoney(harga)}`;
    } else {
        price.value = '0.00';
        info.textContent = 'Jenis & harga auto.';
    }
    calculateGrandTotal();
}

function handleCustomCalculation(rowId) {
    const row = document.getElementById(rowId);
    if (!row) return;
    const sel = row.querySelector('.select-kod-karpet');
    if (!sel || sel.value !== 'CUSTOM') { calculateGrandTotal(); return; }

    const modKira = row.querySelector('.select-mod-custom-kira').value;
    const priceFinalInput = row.querySelector('.inp-harga-final');
    const info = row.querySelector('.jenis-vlookup-info');

    if (modKira === 'HARGA_TERUS') {
        const namaJenisTerus = row.querySelector('.inp-custom-jenis-terus').value.trim() || 'CUSTOM CARPET';
        if (info) {
            info.innerHTML = `<strong>${escapeHtml(namaJenisTerus.toUpperCase())}</strong><br><span style="color:#e67e22;"><i class="fa-solid fa-pen"></i> Sila masukkan nilai harga bulat langsung di kotak Harga Jualan</span>`;
        }
    } 
    else if (modKira === 'KIRA_SQFT') {
        const namaJenisSqft = row.querySelector('.inp-custom-jenis-sqft').value.trim() || 'CUSTOM CARPET';
        const lebar = parseFloat(row.querySelector('.inp-lebar').value) || 0;
        const panjang = parseFloat(row.querySelector('.inp-panjang').value) || 0;
        const priceSqft = parseFloat(row.querySelector('.inp-price-sqft').value) || 0;

        const luas = lebar * panjang;
        const hargaUnitFormula = luas * priceSqft;
        const viewLuas = row.querySelector('.view-luas');
        if (viewLuas) viewLuas.value = luas.toFixed(1) + ' sqft';

        if (priceFinalInput && priceFinalInput.dataset.isManualOverride !== "true") {
            priceFinalInput.value = hargaUnitFormula.toFixed(2);
        }
        if (info) {
            if (priceFinalInput && priceFinalInput.dataset.isManualOverride === "true") {
                info.innerHTML = `<strong>${escapeHtml(namaJenisSqft.toUpperCase())}</strong><br><span style="color:#e67e22;"><i class="fa-solid fa-pen"></i> Harga Formula Luas Dipotong Manual (Override)</span>`;
            } else {
                info.innerHTML = `<strong>${escapeHtml(namaJenisSqft.toUpperCase())}</strong><br>${lebar.toFixed(1)}ft × ${panjang.toFixed(1)}ft = ${luas.toFixed(1)} sqft × ${formatMoney(priceSqft)}/sqft = Kos: ${formatMoney(hargaUnitFormula)}`;
            }
        }
    }
    calculateGrandTotal();
}


function calculateGrandTotal() {
    let total = 0;
    document.querySelectorAll('.card-item-row').forEach(row => {
        // Ambil nilai kuantiti (jika kosong atau tiada angka, lalai kepada 1)
        const qty = parseInt(row.querySelector('.inp-qty')?.value) || 1;
        
        // Ambil nilai harga bersih akhir dari kotak jualan
        const price = parseFloat(row.querySelector('.inp-harga-final')?.value) || 0;
        
        // Mengira keseluruhan jualan baris: mendarabkan Harga Jualan Tertera × Kuantiti
        total += qty * price;
    });
    
    // Paparkan kemas kini terus pada label Jumlah Keseluruhan Tempahan
    const grandTotalLabel = document.getElementById('grandTotalLabel');
    if (grandTotalLabel) {
        grandTotalLabel.textContent = formatMoney(total);
    }
}


function removeCarpetRow(rowId) {
    if (document.getElementById('carpetItemsContainer').querySelectorAll('.card-item-row').length <= 1) { toast('Perlu sekurang-kurangnya satu item.'); return; }
    document.getElementById(rowId)?.remove();
    calculateGrandTotal();
}

async function simpanTempahan() {
    const isBaru = document.querySelector('input[name="custType"]:checked')?.value === 'baru';
    let custId, custNama, custTel, custAlamat, custDaerah;

    if (isBaru) {
        custNama = document.getElementById('custNamaBaru')?.value.trim() || '';
        custTel = document.getElementById('custTelBaru')?.value.trim().replace(/[- ]/g, '') || '';
        custAlamat = document.getElementById('custAlamatBaru')?.value.trim() || '';
        custDaerah = document.getElementById('custDaerahBaru')?.value.trim() || '';

        if (!custAlamat) {
            toast('Sila isi ALAMAT pelanggan (wajib).');
            return;
        }
        custNama = custNama || '-';
        custTel = custTel || '-';
        custDaerah = custDaerah || '-';
        custId = '';
        STATE.lastCustomer = { NAMA: custNama, TELEFON: custTel, ALAMAT: custAlamat, DAERAH: custDaerah };
    } else {
        custId = document.getElementById('optPelanggan')?.value;
        if (!custId) { toast('Sila pilih pelanggan.'); return; }
        const cust = STATE.pelanggan.find(p => String(getField(p, ['CUSTOMER ID','CUSTOMER_ID'])).trim() === custId);
        if (!cust) { toast('Pelanggan tidak ditemui.'); return; }
        custTel = getField(cust, ['TELEFON','NO TELEFON'], '');
        custNama = getField(cust, ['NAMA'], '');
        custAlamat = getField(cust, ['ALAMAT'], '');
        custDaerah = getField(cust, ['DAERAH'], '');
        if (!custAlamat) {
            toast('Pelanggan ini tiada ALAMAT. Sila kemaskini rekod pelanggan terlebih dahulu.');
            return;
        }
        custNama = custNama || '-';
        custTel = custTel || '-';
        custDaerah = custDaerah || '-';
        STATE.lastCustomer = { NAMA: custNama, TELEFON: custTel, ALAMAT: custAlamat, DAERAH: custDaerah };
    }

    // Tarikh ambil
    const tarikhInput = document.getElementById('tarikhAmbil');
    let today;
    if (tarikhInput && tarikhInput.value) {
        const parts = tarikhInput.value.split('-');
        today = new Date(parts[0], parts[1]-1, parts[2]);
        today = today.toISOString().split('T')[0];
    } else {
        today = getToday();
    }
    const tarikhSiap = addDays(today, 7);

    // Kumpul item mentah (dengan qty mungkin > 1)
    const rawItems = [];
    let valid = true;
    document.querySelectorAll('.card-item-row').forEach(row => {
        const sel = row.querySelector('.select-kod-karpet');
        if (!sel || !sel.value) { valid = false; return; }
        const opt = sel.options[sel.selectedIndex];
        const qty = Math.max(1, parseInt(row.querySelector('.inp-qty')?.value) || 1);
        const hargaSkrinSemasa = parseFloat(row.querySelector('.inp-harga-final')?.value) || 0;

        let harga, jenis, kod;
        if (sel.value === 'CUSTOM') {
            harga = hargaSkrinSemasa;
            const modKiraSelect = row.querySelector('.select-mod-custom-kira');
            const modCustom = modKiraSelect ? modKiraSelect.value : 'HARGA_TERUS';
            if (modCustom === 'HARGA_TERUS') {
                const jenisInput = row.querySelector('.inp-custom-jenis-terus');
                const jenisTxt = jenisInput ? jenisInput.value.trim() : 'CUSTOM CARPET';
                kod = 'CUSTOM';
                jenis = jenisTxt;
            } else {
                const jenisInput = row.querySelector('.inp-custom-jenis-sqft');
                const jenisTxt = jenisInput ? jenisInput.value.trim() : 'CUSTOM CARPET';
                const lebar = parseFloat(row.querySelector('.inp-lebar')?.value) || 0;
                const panjang = parseFloat(row.querySelector('.inp-panjang')?.value) || 0;
                kod = 'CUSTOM_SQFT';
                jenis = `${jenisTxt} (${lebar} x ${panjang})`;
            }
        } else {
            harga = hargaSkrinSemasa;
            jenis = opt?.dataset?.jenis || '';
            kod = sel.value;
        }
        rawItems.push({ kod, jenis, harga, qty });
    });

    if (!valid || !rawItems.length) {
        toast('Pastikan semua kod karpet dipilih.');
        return;
    }

    // PENTING: Pecahkan setiap item mengikut kuantiti menjadi item individu (qty=1)
    const expandedItems = [];
    rawItems.forEach(item => {
        for (let i = 0; i < item.qty; i++) {
            expandedItems.push({
                kod: item.kod,
                jenis: item.jenis,
                harga: item.harga,
                qty: 1,
                subtotal: item.harga   // kerana qty=1
            });
        }
    });

    // Kira jumlah keseluruhan berdasarkan expandedItems
    const total = expandedItems.reduce((sum, item) => sum + item.subtotal, 0);

    showLoading(true);
    await new Promise((resolve) => {
        fetchData(() => resolve(), true);
    });
    showLoading(false);

    const invNo = generateInvoiceNumber();

    showLoading(true);
    // Hantar expandedItems (setiap satu qty=1) ke backend
    await postData({
        action: 'createOrder',
        invNo,
        isNewCustomer: isBaru,
        customer: { id: custId, nama: custNama, telefon: custTel, alamat: custAlamat, daerah: custDaerah },
        items: expandedItems,          // <-- Guna expandedItems
        total,
        tarikhAmbil: today,
        tarikhSiap: tarikhSiap
    });
    showLoading(false);

    toast('Tempahan berjaya disimpan! No Invois: ' + invNo);

    // Mesej WhatsApp: senaraikan setiap unit secara individu
    const itemsText = expandedItems.map((item, i) =>
        ` ${i+1}. *${item.jenis}* (${item.kod}) = *${formatMoney(item.subtotal)}*`
    ).join('\n');

    const msg = `🧺 *Pusat Cucian Karpet MyCarpetPro v3.0*\n\n` +
        `Pelanggan yang dihormati, karpet anda telah selamat diambil.\n\n` +
        `🧾 *No Invoice:* ${invNo}\n` +
        `📅 Tarikh Ambil: ${formatDateMY(today)}\n` +
        `📆 Tarikh Siap: ${formatDateMY(tarikhSiap)}\n` +
        `📦 Jumlah Karpet: ${expandedItems.length} unit\n\n` +
        `📝 *Butiran Setiap Karpet:*\n${itemsText}\n\n` +
        `💰 *Jumlah Harga:* *${formatMoney(total)}*\n` +
        `📌 Status: Pickup & Proses Cucian\n\n` +
        `Terima kasih! 🙏`;

    document.getElementById('tempahanPreview').textContent = msg;
    document.getElementById('tempahanPreview').classList.remove('hidden');
    document.getElementById('tempahanWhatsAppBtn').classList.remove('hidden');
    STATE.lastOrderMsg = msg;
    fetchData(null, true);
}

function executeTrackingSearch() {
    // 1. Ambil nilai input dengan bersih tanpa aksara putih tersembunyi
    const invSelect = document.getElementById('trackingInvoiceSelect');
    const inv = invSelect ? invSelect.value.trim().toUpperCase() : '';
    const search = document.getElementById('trackingSearchBox').value.trim().toLowerCase();
    
    let filtered = STATE.karpet.filter(k => {
        const st = normalize(getField(k, ['STATUS']));
        if (st === 'SELESAI DIHANTAR') return false;
        
        const invNo = normalize(getField(k, ['INV NO','INV_NO']));
        
        // Pembetulan penapisan: Pastikan perbandingan invois dibuat secara fleksibel/bersih
        if (inv && invNo !== inv) return false;
        
        if (search) {
            const qr = String(getField(k, ['QR ID','QR_ID'])).toLowerCase();
            const jenis = String(getField(k, ['JENIS','JENIS CARPET'])).toLowerCase();
            if (!qr.includes(search) && !jenis.includes(search)) return false;
        }
        return true;
    });
    
    const tbody = document.getElementById('trackingTableBody');
    if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center muted">Tiada data</td></tr>';
        document.getElementById('trackingCheckedCount').textContent = '0 item dipilih';
        return;
    }
    
    let html = '';
    filtered.forEach(k => {
        const qrId = escapeHtml(getField(k, ['QR ID','QR_ID']));
        const invNo = escapeHtml(getField(k, ['INV NO','INV_NO']));
        const jenis = escapeHtml(getField(k, ['JENIS','JENIS CARPET']));
        const harga = formatMoney(getField(k, ['HARGA']));
        const st = normalize(getField(k, ['STATUS']));
        const badge = st==='READY TO DELIVER'?'badge-ready':st==='SELESAI'?'badge-selesai':st==='PENGERINGAN'?'badge-cuci':'badge-proses';
        const rak = escapeHtml(getField(k, ['RAK'], '-'));
        
        // PEMBETULAN UTAMA: Hubungkan Karpet -> Tempahan -> Pelanggan untuk dapatkan Alamat Sahih
        const order = STATE.tempahan.find(o => normalize(getField(o, ['INV NO','INV_NO','NO INVOIS'])) === normalize(invNo)) || {};
        const orderCustId = getField(order, ['CUSTOMER ID','CUSTOMER_ID']);
        
        const cust = STATE.pelanggan.find(c => String(getField(c, ['CUSTOMER ID','CUSTOMER_ID'])).trim() === String(orderCustId).trim()) || {};
        const nama = escapeHtml(getField(cust, ['NAMA'], '-'));
        const alamat = escapeHtml(getField(cust, ['ALAMAT'], '-'));
        
        html += `<tr>
            <td><input type="checkbox" class="tracking-row-checkbox" value="${qrId}" onchange="updateTrackingCount()"></td>
            <td><strong>${qrId}</strong><br><small>${invNo}</small></td>
            <td>${nama}<br><small style="color: #4a5568; font-weight: 500;">${alamat}</small></td>
            <td>${jenis}</td>
            <td>${harga}</td>
            <td><span class="badge ${badge}">${escapeHtml(st)}</span></td>
            <td>${rak}</td>
            <td><button class="btn btn-secondary btn-sm" onclick="updateSingleStatus('${qrId}')"><i class="fa-solid fa-pen"></i></button></td>
        </tr>`;
    });
    tbody.innerHTML = html;
    updateTrackingCount();
}

function openQRScanner() {
    const preview = document.getElementById('cameraPreview');
    const status = document.getElementById('scanStatus');
    if (html5QrCodeInstance) {
        closeQRScanner();
    }
    preview.style.display = 'block';
    status.innerText = 'Membuka kamera...';

    // Inisialisasi enjin kamera tanpa sekatan format tegar demi keserasian telefon pintar
    html5QrCodeInstance = new Html5Qrcode("qr-reader");
    
    const config = {
        fps: 20, // Pemprosesan imej dipercepat kepada 20 frame per saat
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0
    };

    html5QrCodeInstance.start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        onScanError
    ).then(() => {
        status.innerText = 'Kamera aktif. Sila halakan tepat pada QR Code...';
    }).catch(err => {
        status.innerText = 'Gagal buka kamera: ' + err;
        preview.style.display = 'none';
        html5QrCodeInstance = null;
    });
}

function onScanSuccess(decodedText, decodedResult) {
    const status = document.getElementById('scanStatus');
    const qrId = decodedText.trim();
    
    console.log("QR Berjaya Diimbas:", qrId);
    status.innerText = 'QR dijumpai: ' + qrId;
    
    // Membuang simbol putih tersembunyi yang dihasilkan oleh ralat pencetakan resi
    const cleanQrId = qrId.replace(/[\r\n\t]/g, "").trim();

    // Semak padanan ID karpet dalam pangkalan data pautan STATE
    const k = STATE.karpet.find(x => String(getField(x, ['QR ID','QR_ID'])).trim() === cleanQrId);
    
    if (k) {
        playBeep(); // Bunyikan isyarat bip digital tanda pengesahan berjaya
        
        // MENYUAP HASIL IMBASAN: Masukkan nilai teks terus ke kotak carian utama tracking
        const inputCarian = document.getElementById('trackingSearchBox');
        if (inputCarian) {
            inputCarian.value = cleanQrId;
            
            // Mencetuskan event input secara paksa agar fungsi penapisan jadual bertindak balas serta-merta
            inputCarian.dispatchEvent(new Event('input'));
        }
        
        status.innerHTML = `<span style="color:green; font-weight:bold;">Data disuap ke kotak carian. Sila edit status di bawah.</span>`;
        
        // Tutup kamera scanner secara automatik bagi mengosongkan ruang skrin untuk dropdown edit
        closeQRScanner();
        
    } else {
        status.innerHTML = `<span style="color:red; font-weight:bold;">ID: "${cleanQrId}" tiada dalam rekod penjejakan sistem!</span>`;
    }
}

function onScanError(err) {
    // Diabaikan untuk mengelakkan banjir log amaran dalam konsol penyemak imbas
}

function closeQRScanner() {
    if (html5QrCodeInstance) {
        try {
            html5QrCodeInstance.stop().then(() => {
                html5QrCodeInstance.clear();
                html5QrCodeInstance = null;
            }).catch(() => {});
        } catch(e) {}
    }
    document.getElementById('cameraPreview').style.display = 'none';
    document.getElementById('scanStatus').innerText = '';
}

function updateStatuses(qrIds, status) {
    if (!navigator.onLine) {
        saveToOfflineQueue(qrIds, status);
        toast('Disimpan dalam offline queue. Akan dihantar bila internet pulih.');
        executeTrackingSearch();
        return;
    }
    showLoading(true);
    postData({ action: 'updateBatchStatus', qrIds: qrIds, status: status })
        .then(() => {
            showLoading(false);
            toast(qrIds.length + ' item dikemaskini ke ' + status);
            playBeep();
            fetchData(null, true);
            setTimeout(executeTrackingSearch, 500);
        })
        .catch(() => {
            showLoading(false);
            toast('Gagal kemaskini. Cuba lagi.');
        });
}

function toggleTorch() {
    if (!html5QrCodeInstance) {
        toast('Sila buka kamera dahulu.');
        return;
    }
    try {
        const video = document.querySelector('#qr-reader video');
        if (video) {
            const stream = video.srcObject;
            if (stream) {
                const track = stream.getVideoTracks();
                if (track && track.length > 0) {
                    const capabilities = track[0].getCapabilities ? track[0].getCapabilities() : {};
                    if (capabilities.torch) {
                        track[0].applyConstraints({ advanced: [{ torch: !torchOn }] }).then(() => {
                            torchOn = !torchOn;
                            toast('Lampu suluh ' + (torchOn ? 'ON' : 'OFF'));
                        }).catch(() => toast('Gagal kawal lampu.'));
                    } else {
                        toast('Peranti tidak menyokong lampu suluh.');
                    }
                }
            }
        } else {
            toast('Tiada video stream dijumpai.');
        }
    } catch (e) {
        toast('Gagal kawal lampu: ' + e.message);
    }
}

function playBeep() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 800;
        osc.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); }, 200);
    } catch (e) { console.warn('Beep gagal:', e); }
}

function manualDelivery() {
    const checkboxes = document.querySelectorAll('.tracking-row-checkbox:checked');
    if (!checkboxes.length) {
        toast('Sila pilih item yang hendak ditandakan selesai dihantar.');
        return;
    }
    const ids = Array.from(checkboxes).map(cb => cb.value);
    const validIds = ids.filter(id => {
        const k = STATE.karpet.find(x => String(getField(x, ['QR ID','QR_ID'])).trim() === id);
        return k && normalize(getField(k, ['STATUS'])) !== 'SELESAI DIHANTAR';
    });
    
    if (!validIds.length) {
        toast('Item yang dipilih sudah selesai dihantar.');
        return;
    }
    if (!confirm('Anda pasti ingin menandakan ' + validIds.length + ' item sebagai SELESAI DIHANTAR?')) return;
    updateStatuses(validIds, 'SELESAI DIHANTAR');
}

function renderPayment(container) {
    const invList = [];
    STATE.tempahan.forEach(t => {
        const inv = String(getField(t, ['INV NO','INV_NO','NO INVOIS'])).trim();
        if (!inv) return;
        const status = normalize(getField(t, ['STATUS'], 'Pending'));
        const cust = STATE.pelanggan.find(c => String(getField(c, ['CUSTOMER ID','CUSTOMER_ID'])) === String(getField(t, ['CUSTOMER ID','CUSTOMER_ID']))) || {};
        const nama = getField(cust, ['NAMA'], '');
        const alamat = getField(cust, ['ALAMAT'], '');
        invList.push({ inv, status, nama, alamat });
    });
    invList.sort((a, b) => {
        if (a.status === 'PENDING' && b.status !== 'PENDING') return -1;
        if (a.status !== 'PENDING' && b.status === 'PENDING') return 1;
        return b.inv.localeCompare(a.inv);
    });
    const invoiceOptions = invList.map(item => {
        const label = item.status === 'PENDING' ? '⏳ PENDING' : '✅ PAID';
        return `<option value="${escapeHtml(item.inv)}">${escapeHtml(item.inv)} — ${escapeHtml(item.nama)} — ${escapeHtml(item.alamat)} [${label}]</option>`;
    }).join('');
    container.innerHTML = `

function loadPaymentData() {
    const inv = document.getElementById('paymentInvoiceSelect').value;
    const infoDiv = document.getElementById('paymentInfo');
    if (!inv) { infoDiv.classList.add('hidden'); return; }
    infoDiv.classList.remove('hidden');
    const order = STATE.tempahan.find(o => normalize(getField(o, ['INV NO','INV_NO','NO INVOIS'])) === normalize(inv));
    const total = getNumber(getField(order, ['JUMLAH HARGA'], 0));
    const discount = getNumber(document.getElementById('payDiscount')?.value || 0);
    const effectiveTotal = Math.max(0, total - discount);
    let deposit = 0;
    let baki = effectiveTotal;
    const payments = STATE.payment.filter(p => normalize(getField(p, ['INV NO','INV_NO','NO INVOIS'])) === normalize(inv));
    payments.forEach(p => { deposit += getNumber(getField(p, ['AMAUN DIBAYAR','AMOUNT'])); });
    if (payments.length > 0) { const lastP = payments[payments.length - 1]; const lb = getNumber(getField(lastP, ['BAKI'])); if (!isNaN(lb)) baki = lb; }
    else { baki = Math.max(0, effectiveTotal - deposit); }
    document.getElementById('payTotal').value = formatMoney(effectiveTotal);
    document.getElementById('payDeposit').value = formatMoney(deposit);
    document.getElementById('payBalance').value = formatMoney(baki);
    const historyDiv = document.getElementById('paymentHistory');
    if (payments.length) {
        let html = '<strong>Sejarah Bayaran</strong><ul style="list-style:none;padding:0;margin-top:8px;">';
        payments.forEach(p => { html += `<li style="padding:4px 0;border-bottom:1px solid #eee;">${escapeHtml(String(getField(p, ['TARIKH','DATE'], '-')))} — ${formatMoney(getField(p, ['AMAUN DIBAYAR','AMOUNT']))} (${escapeHtml(getField(p, ['KAEDAH PEMBAYARAN','METHOD'], 'TUNAI'))})</li>`; });
        html += '</ul>'; historyDiv.innerHTML = html;
    } else { historyDiv.innerHTML = '<p class="muted">Tiada rekod bayaran.</p>'; }
}

async function rekodBayaran() {
    const inv = document.getElementById('paymentInvoiceSelect').value;
    if (!inv) return toast('Sila pilih invois.');
    const amount = getNumber(document.getElementById('payAmount').value);
    if (amount <= 0) return toast('Masukkan jumlah bayaran yang sah.');
    const method = document.getElementById('payMethod').value;
    const date = getToday();
    const discount = getNumber(document.getElementById('payDiscount')?.value || 0);
    showLoading(true);
    await postData({ action: 'addPayment', invNo: inv, amount, method, date, discount });
    showLoading(false);
    toast('Bayaran direkodkan.');
    document.getElementById('payAmount').value = '';
    const order = STATE.tempahan.find(o => normalize(getField(o, ['INV NO','INV_NO','NO INVOIS'])) === normalize(inv));
    const cust = STATE.pelanggan.find(c => String(getField(c, ['CUSTOMER ID','CUSTOMER_ID'])) === String(getField(order, ['CUSTOMER ID','CUSTOMER_ID']))) || {};
    const tel = String(getField(cust, ['TELEFON','NO TELEFON'], '')).replace(/[- ]/g, '');
    fetchData(() => {
        loadPaymentData();
        const updatedOrder = STATE.tempahan.find(o => normalize(getField(o, ['INV NO','INV_NO','NO INVOIS'])) === normalize(inv));
        if (updatedOrder) {
            let td = 0;
            STATE.payment.forEach(p => { if (normalize(getField(p, ['INV NO','INV_NO','NO INVOIS'])) === normalize(inv)) td += getNumber(getField(p, ['AMAUN DIBAYAR','AMOUNT'])); });
            if (td >= getNumber(getField(updatedOrder, ['JUMLAH HARGA'], 0))) { postData({ action: 'updateOrderStatus', invNo: inv, status: 'PAID' }); }
        }
        const lps = STATE.payment.filter(p => normalize(getField(p, ['INV NO','INV_NO','NO INVOIS'])) === normalize(inv));
        let bt = 0;
        if (lps.length > 0) { bt = getNumber(getField(lps[lps.length - 1], ['BAKI'])); }
        const msg = `🧾 *Pusat Cucian Karpet MyCarpetPro v3.0*\n\nPembayaran anda telah kami terima.\n\n🧾 No Invoice: ${inv}\n💰 Jumlah Dibayar: ${formatMoney(amount)}\n💳 Baki Terkini: ${formatMoney(bt)}\n📅 Tarikh Bayaran: ${formatDateMY(date)}\n💳 Kaedah: ${method}\n\nTerima kasih! 🙏`;
        const pe = document.getElementById('paymentWhatsAppPreview'), wb = document.getElementById('paymentWhatsAppBtn');
        if (pe) { pe.textContent = msg; pe.classList.remove('hidden'); }
        if (wb) wb.classList.remove('hidden');
        STATE.paymentWhatsAppMsg = msg; STATE.paymentWhatsAppTel = tel;
    }, true);
}

function hantarWhatsAppPembayaran() {
    const tel = STATE.paymentWhatsAppTel, msg = STATE.paymentWhatsAppMsg;
    if (!tel) return toast('Nombor telefon tidak dijumpai.');
    if (!msg) return toast('Tiada mesej.');
    bukaWhatsApp(tel, msg);
}

async function prepareInvoiceForExport() {
    const element = document.getElementById('invoicePrintArea');
    if (!element) throw new Error('Tiada invois dipilih.');

    const clone = element.cloneNode(true);
    clone.style.position = 'absolute';
    clone.style.left = '-9999px';
    clone.style.top = '0';
    clone.style.width = '210mm';
    clone.style.margin = '0 auto';
    clone.style.padding = '0';
    document.body.appendChild(clone);

    const images = Array.from(clone.querySelectorAll('img'));
    await Promise.all(images.map(img => {
        if (img.complete && img.naturalWidth > 0) return Promise.resolve();
        return new Promise((resolve) => {
            img.onload = resolve;
            img.onerror = resolve;
            if (img.src) img.src = img.src;
        });
    }));

    return clone;
}

async function shareInvoiceWithAttachment() {
    const data = STATE.currentInvoiceData;
    if (!data || !data.telefon) { toast('Sila pilih invois dahulu.'); return; }
    const element = document.getElementById('invoicePrintArea');
    if (!element) { toast('Sila pilih invois dahulu.'); return; }
    const isPaid = data.isPaid;
    const fileName = isPaid ? `Invoice_${data.inv}.pdf` : `Invoice_${data.inv}_Pending.png`;
    const mimeType = isPaid ? 'application/pdf' : 'image/png';
    toast('Menyediakan lampiran...');
    let fileBlob;
    try {
        if (isPaid) { 
            // PEMBETULAN: Nilai margin diletakkan array yang sah [10, 10, 10, 10]
            const pdfBlob = await html2pdf().set({ 
                margin: 10, 
                filename: fileName, 
                image: { type: 'jpeg', quality: 0.98 }, 
                html2canvas: { scale: 2, useCORS: true, logging: false }, 
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['css', 'legacy'], avoid: ['table', 'tr', 'div'] } 
            }).from(element).outputPdf('blob'); 
            fileBlob = pdfBlob; 
        }
        else { 
            const canvas = await html2canvas(element, { scale: 2, useCORS: true }); 
            fileBlob = await new Promise(res => canvas.toBlob(res, 'image/png')); 
        }
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([fileBlob], fileName, { type: mimeType })] })) {
            const file = new File([fileBlob], fileName, { type: mimeType });
            await navigator.share({ title: `Invoice ${data.inv}`, text: data.msg, files: [file] });
            toast('Invois berjaya dikongsi!');
            setTimeout(() => { bukaWhatsApp(data.telefon, data.msg); }, 800);
            return;
        }
    } catch (err) { console.warn('Web Share gagal atau tidak disokong:', err); }
    try { if (fileBlob) { const url = URL.createObjectURL(fileBlob); const a = document.createElement('a'); a.href = url; a.download = fileName; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); toast('Fail dimuat turun. Sila lampirkan secara manual di WhatsApp.'); } } catch (e) { console.error('Muat turun gagal:', e); toast('Gagal memuat turun fail.'); }
    bukaWhatsApp(data.telefon, data.msg);
}

function downloadInvoicePDF() {
    const element = document.getElementById('invoicePrintArea');
    if (!element) { toast('Sila pilih invois dahulu.'); return; }
    if (typeof html2pdf === 'undefined') { 
        toast('Pustaka PDF sedang dimuat. Sila cuba sebentar lagi.'); 
        const script = document.createElement('script'); 
        script.src = 'https://cloudflare.com'; 
        script.onload = () => { toast('Pustaka PDF siap. Sila cuba lagi.'); }; 
        document.head.appendChild(script); 
        return; 
    }
    
    // PEMBETULAN: Nilai margin diletakkan array yang sah [10, 10, 10, 10]
    const opt = { 
        margin:, 
        filename: `Invoice_${STATE.currentInvoiceData?.inv || 'inv'}.pdf`, 
        image: { type: 'jpeg', quality: 0.98 }, 
        html2canvas: { scale: 2, useCORS: true, logging: false }, 
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['css', 'legacy'], avoid: ['table', 'tr', 'div'] } 
    };
    
    toast('Sedang menjana PDF...');
    html2pdf().set(opt).from(element).save().then(() => { 
        toast('PDF berjaya dimuat turun!'); 
    }).catch((err) => { 
        console.error('PDF error:', err); 
        toast('Gagal menjana PDF. Sila cuba lagi.'); 
    });
}

function renderPelangganList(searchTerm = '') {
    const container = document.getElementById('pelangganListContainer');
    let list = STATE.pelanggan || [];
    if (searchTerm) {
        list = list.filter(c => {
            const nama = String(getField(c, ['NAMA'], '')).toLowerCase();
            const tel = String(getField(c, ['TELEFON','NO TELEFON'], '')).toLowerCase();
            return nama.includes(searchTerm) || tel.includes(searchTerm);
        });
    }
    if (!list.length) {
        container.innerHTML = '<p class="muted text-center">Tiada pelanggan.</p>';
        return;
    }
    const loyaltyMap = {};
    STATE.tempahan.forEach(t => {
        const cid = getField(t, ['CUSTOMER ID','CUSTOMER_ID']);
        if (cid) {
            loyaltyMap[cid] = (loyaltyMap[cid] || 0) + getNumber(getField(t, ['JUMLAH HARGA'], 0));
        }
    });
    let html = `<div class="table-wrap"><table class="data-table">

        <tbody>`;
    list.forEach(c => {

        const nama = escapeHtml(getField(c, ['NAMA'], '-'));
        const tel = escapeHtml(String(getField(c, ['TELEFON','NO TELEFON'], '-')));
        const alamat = escapeHtml(getField(c, ['ALAMAT'], '-'));
        const daerah = escapeHtml(getField(c, ['DAERAH'], '-'));
        const mata = Math.floor(loyaltyMap[id] || 0);
        html += `<tr>
            <td><strong>${id}</strong></td>
            <td>${nama}</td>
            <td>${tel}</td>
            <td>${alamat}</td>
            <td>${daerah}</td>
            <td>${mata} ★</td>
            <td>
                <button class="btn btn-secondary btn-sm" onclick="lihatSejarahPelanggan('${id}')"><i class="fa-solid fa-clock-rotate-left"></i> Sejarah</button>
                <button class="btn btn-secondary btn-sm" onclick="showEditPelanggan('${id}')"><i class="fa-solid fa-pen"></i> Edit</button>

function renderWorkerCommission(container) {
    const workers = STATE.pekerja || [];
    const komisenData = STATE.komisen || [];
    let workerOptions = '<option value="">-- Pilih Pekerja --</option>';
    workers.forEach(w => {
        const id = escapeHtml(getField(w, ['ID','WORKER_ID'], ''));
        const nama = escapeHtml(getField(w, ['NAMA'], ''));
        workerOptions += `<option value="${id}">${id} - ${nama}</option>`;
    });
    let qrOptions = '<option value="">-- Pilih QR ID --</option>';
    STATE.karpet.forEach(k => {
        const st = normalize(getField(k, ['STATUS']));
        if (st === 'DALAM PROSES') {
            const qr = escapeHtml(String(getField(k, ['QR ID','QR_ID'], '')));
            qrOptions += `<option value="${qr}">${qr}</option>`;
        }
    });
    const now = new Date();
    const currentMonth = `${now.getFullYear()}-${('0' + (now.getMonth() + 1)).slice(-2)}`;
    const monthlyKomisen = {};
    komisenData.forEach(k => {
        const tgl = String(getField(k, ['TARIKH'], '')).substring(0, 7);
        if (tgl === currentMonth) {
            const wid = getField(k, ['ID PEKERJA'], '');
            monthlyKomisen[wid] = (monthlyKomisen[wid] || 0) + getNumber(getField(k, ['KOMISEN (RM)'], 0));
        }
    });
    let laporanHtml = '<h4>Komisen Bulan Ini</h4><ul>';
    workers.forEach(w => {
        const wid = getField(w, ['ID','WORKER_ID'], '');
        const nama = getField(w, ['NAMA'], '-');
        const total = monthlyKomisen[wid] || 0;
        laporanHtml += `<li>${escapeHtml(nama)}: RM ${total.toFixed(2)}</li>`;
    });
    laporanHtml += '</ul>';
    container.innerHTML = `
        <h3 class="card-title">💰 Tambah Komisen Pekerja</h3>
        <div class="row">
            <div class="col form-group"><label>Pilih Pekerja</label><select id="komisenWorkerSelect" class="form-control">${workerOptions}</select></div>

async function tambahRunnerTask() {
    const workerId = document.getElementById('runnerSelect').value;

    const tarikh = document.getElementById('runnerTarikh').value;

    const worker = STATE.pekerja.find(w => normalize(getField(w, ['ID','WORKER_ID'])) === normalize(workerId));

    await postData({ action: 'addRunnerTask', workerId, workerName, alamat, tarikh, status });
    showPriceMsg('runnerMsg', '✅ Tugasan berjaya disimpan!', 'success');
    fetchData(null, true);
    setTimeout(() => renderWorkerRunner(document.getElementById('workerTabContent')), 1500);
}

function renderPriceMatrix(container) {
    container.innerHTML = `
        <button class="btn btn-secondary btn-back-menu" onclick="kembaliKeMenuUtama()"><i class="fa-solid fa-arrow-left"></i> Kembali ke Menu</button>
        <header><div><h1>📋 Price Matrix</h1><p class="muted">Tetapan kod, jenis permaidani, dan kos cucian semasa</p></div></header>
        <div class="card">
            <div class="flex" style="border-bottom:1px solid var(--border-color);margin-bottom:16px;">
                <button class="tab-btn active" data-tab="pricelist" onclick="switchPriceTab('pricelist', this)">🔍 Senarai Katalog</button>
                <button class="tab-btn" data-tab="addprice" onclick="switchPriceTab('addprice', this)">➕ Tambah Kod Baru</button>
                <button class="tab-btn" data-tab="bulkprice" onclick="switchPriceTab('bulkprice', this)">🧮 Formula Pukal</button>
            </div>
            <div id="priceTabContent"></div>
        </div>
    `;
    switchPriceTab('pricelist', document.querySelector('.tab-btn.active'));
}

function switchPriceTab(tabId, btn) {
    document.querySelectorAll('#priceTabContent .tab-btn, .tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const content = document.getElementById('priceTabContent');
    if (tabId === 'pricelist') renderPriceList(content);
    else if (tabId === 'addprice') renderAddPriceForm(content);
    else if (tabId === 'bulkprice') renderBulkPrice(content);
}

function renderPriceList(container) {
    const data = STATE.senaraiHarga || [];
    if (!data.length) { container.innerHTML = '<p class="muted">⚠️ Tiada data dijumpai dalam senarai harga.</p>'; return; }
    let html = '<div class="table-wrap"><table class="data-table"><thead><tr><th>KOD</th><th>JENIS CARPET</th><th>HARGA OPEN</th></tr></thead><tbody>';
    data.forEach(item => {
        const kod = escapeHtml(getField(item, ['KOD'], ''));
        const jenis = escapeHtml(getField(item, ['JENIS CARPET'], ''));
        const harga = getNumber(getField(item, ['HARGA OPEN'], 0));
        html += `<tr><td><strong>${kod}</strong></td><td>${jenis}</td><td>${formatMoney(harga)}</td></tr>`;
    });
    html += '</tbody></table></div>';
    container.innerHTML = html;
}

function renderAddPriceForm(container) {
    container.innerHTML = `
        <h3 class="card-title">➕ Pendaftaran Gred/Jenis Karpet Baru</h3>
        <div class="row">
            <div class="col form-group"><label>Kod Karpet Baru (Contoh: CK 5X7)</label><input type="text" id="newPriceKod" class="form-control" placeholder="CK 5X7" style="text-transform:uppercase;"></div>
            <div class="col form-group"><label>Nama/Jenis Karpet</label><input type="text" id="newPriceJenis" class="form-control" placeholder="CUCIAN CARPET..."></div>
        </div>
        <div class="form-group"><label>Harga Seunit (RM)</label><input type="number" id="newPriceHarga" class="form-control" min="0" step="0.50" value="15.00"></div>
        <button class="btn btn-primary" onclick="addNewPrice()"><i class="fa-solid fa-save"></i> Daftarkan Ke Dalam Katalog</button>
        <div id="addPriceMsg" class="mt-16"></div>
    `;
}

async function addNewPrice() {
    const kod = document.getElementById('newPriceKod').value.trim().toUpperCase();
    const jenis = document.getElementById('newPriceJenis').value.trim();
    const harga = parseFloat(document.getElementById('newPriceHarga').value) || 0;
    if (!kod || !jenis || harga <= 0) { showPriceMsg('addPriceMsg', '❌ Sila lengkapkan semua ruangan.', 'error'); return; }
    const exists = STATE.senaraiHarga.some(item => normalize(getField(item, ['KOD'])) === normalize(kod));
    if (exists) { showPriceMsg('addPriceMsg', `❌ Kod \`${kod}\` sudah wujud!`, 'error'); return; }
    await postData({ action: 'addHarga', kod, jenis, harga: harga.toFixed(2) });
    showPriceMsg('addPriceMsg', `🎉 Berjaya! Kod \`${kod}\` telah ditambah.`, 'success');
    document.getElementById('newPriceKod').value = '';
    document.getElementById('newPriceJenis').value = '';
    document.getElementById('newPriceHarga').value = '15.00';
    fetchData(null, true);
    setTimeout(() => renderPriceList(document.getElementById('priceTabContent')), 1500);
}

function showPriceMsg(containerId, msg, type) {
    const el = document.getElementById(containerId);
    el.innerHTML = `<div class="${type === 'success' ? 'badge-selesai' : 'badge-proses'}">${msg}</div>`;
    setTimeout(() => { el.innerHTML = ''; }, 4000);
}

function renderBulkPrice(container) {
    const mult = { CK: 1.20, CN: 0.50, CS: 0.50, HP: 1.30, LP: 1.00, CSG: 1.30 };
    container.innerHTML = `
        <h3 class="card-title">🧮 Formula Pengiraan Kos Per Sqft</h3>
        <p class="muted">Masukkan harga darab (RM) bagi setiap kumpulan kod.</p>
        <div class="row" style="margin-bottom:20px;">
            <div class="col form-group"><label>Prefix CK</label><input type="number" id="multCK" class="form-control" value="${mult.CK}" step="0.1" min="0"></div>
            <div class="col form-group"><label>Prefix CN</label><input type="number" id="multCN" class="form-control" value="${mult.CN}" step="0.1" min="0"></div>
            <div class="col form-group"><label>Prefix CS</label><input type="number" id="multCS" class="form-control" value="${mult.CS}" step="0.1" min="0"></div>
            <div class="col form-group"><label>Prefix HP</label><input type="number" id="multHP" class="form-control" value="${mult.HP}" step="0.1" min="0"></div>
            <div class="col form-group"><label>Prefix LP</label><input type="number" id="multLP" class="form-control" value="${mult.LP}" step="0.1" min="0"></div>
            <div class="col form-group"><label>Prefix CSG</label><input type="number" id="multCSG" class="form-control" value="${mult.CSG}" step="0.1" min="0"></div>
        </div>
        <div id="bulkPreviewContainer"></div>
        <button class="btn btn-success mt-16" onclick="saveBulkPrices()"><i class="fa-solid fa-cloud-upload-alt"></i> Sahkan & Kemas Kini Semua Harga</button>
        <div id="bulkPriceMsg" class="mt-16"></div>
    `;

    const extractLuas = (kod) => {
        const match = kod.match(/(\d+)\s*X\s*(\d+)/);
        if (match) return parseFloat(match[1]) * parseFloat(match[2]);
        if (kod.includes('TEBAL')) return 24.0;
        return 0.0;
    };

    const updatePreview = () => {
        const elCK = document.getElementById('multCK');
        if (!elCK) return;
        const mults = {
            CK: parseFloat(elCK.value) || 0,
            CN: parseFloat(document.getElementById('multCN')?.value) || 0,
            CS: parseFloat(document.getElementById('multCS')?.value) || 0,
            HP: parseFloat(document.getElementById('multHP')?.value) || 0,
            LP: parseFloat(document.getElementById('multLP')?.value) || 0,
            CSG: parseFloat(document.getElementById('multCSG')?.value) || 0
        };
        const data = STATE.senaraiHarga || [];
        const previewDiv = document.getElementById('bulkPreviewContainer');
        if (!previewDiv) return;
        let html = '<div class="table-wrap"><table class="data-table"><thead><tr><th>KOD</th><th>JENIS</th><th>HARGA SEMASA</th><th>HARGA BARU (DIKIRA)</th></tr></thead><tbody>';
        data.forEach((item, idx) => {
            const kod = String(getField(item, ['KOD'], '')).toUpperCase().trim();
            const jenis = getField(item, ['JENIS CARPET'], '');
            const hargaSemasa = getNumber(getField(item, ['HARGA OPEN'], 0));
            const luas = extractLuas(kod);
            let multiplier = 1.0;
            const prefixes = ['CSG', 'CK', 'CN', 'CS', 'HP', 'LP'];
            for (const p of prefixes) { if (kod.startsWith(p)) { multiplier = mults[p]; break; } }
            const hargaBaru = luas > 0 ? (luas * multiplier) : hargaSemasa;
            html += `<tr><td><strong>${escapeHtml(kod)}</strong></td><td>${escapeHtml(jenis)}</td><td>${formatMoney(hargaSemasa)}</td><td><input type="number" step="0.01" value="${hargaBaru.toFixed(2)}" data-index="${idx}" data-kod="${escapeHtml(kod)}" class="form-control bulk-input" style="text-align:right;"></td></tr>`;
        });
        html += '</tbody></table></div>';
        previewDiv.innerHTML = html;
    };

    document.querySelectorAll('#multCK, #multCN, #multCS, #multHP, #multLP, #multCSG').forEach(inp => inp.addEventListener('input', updatePreview));
    setTimeout(updatePreview, 50);
}

async function saveBulkPrices() {
    const inputs = document.querySelectorAll('.bulk-input');
    if (inputs.length === 0) return toast('Tiada data harga.');
    const updates = [];
    inputs.forEach(inp => {
        const kod = inp.getAttribute('data-kod');
        const newPrice = parseFloat(inp.value);
        if (!isNaN(newPrice)) { updates.push({ kod, harga: newPrice.toFixed(2) }); }
    });
    if (updates.length === 0) { showPriceMsg('bulkPriceMsg', '❌ Tiada perubahan harga.', 'error'); return; }
    showLoading(true);
    await postData({ action: 'batchUpdateHarga', updates });
    showLoading(false);
    showPriceMsg('bulkPriceMsg', '🎉 Semua harga berjaya dikemas kini!', 'success');
    fetchData(null, true);
    setTimeout(() => renderBulkPrice(document.getElementById('priceTabContent')), 1500);
}

function renderBarcode(container) {
    const invList = [];
    STATE.tempahan.forEach(t => {
        const inv = String(getField(t, ['INV NO','INV_NO','NO INVOIS'])).trim();
        if (!inv) return;
        const cust = STATE.pelanggan.find(c => String(getField(c, ['CUSTOMER ID','CUSTOMER_ID'])) === String(getField(t, ['CUSTOMER ID','CUSTOMER_ID']))) || {};
        const alamat = getField(cust, ['ALAMAT'], '');
        invList.push({ inv, alamat });
    });
    invList.sort((a, b) => b.inv.localeCompare(a.inv));
    const invoiceOptions = invList.map(item => `<option value="${escapeHtml(item.inv)}">${escapeHtml(item.inv)} — ${escapeHtml(item.alamat)}</option>`).join('');
    container.innerHTML = `
        <button class="btn btn-secondary btn-back-menu" onclick="kembaliKeMenuUtama()"><i class="fa-solid fa-arrow-left"></i> Kembali ke Menu</button>
        <header><div><h1>🏷️ Cetak Barcode Karpet</h1><p class="muted">Dioptimumkan untuk saiz kertas thermal 50mm x 30mm</p></div></header>
        <div class="card">
            <div class="form-group"><label>Pilih Invois</label><select id="barcodeInvoiceSelect" class="form-control" onchange="generateBarcodePreview()"><option value="">-- Pilih --</option>${invoiceOptions}</select></div>
            <div id="barcodePreviewContainer" class="mt-16"><p class="muted">Sila pilih invois untuk lihat preview barcode.</p></div>
        </div>`;
}

function generateBarcodePreview() {
    const inv = document.getElementById('barcodeInvoiceSelect').value;
    const container = document.getElementById('barcodePreviewContainer');
    if (!inv) { container.innerHTML = '<p class="muted">Sila pilih invois.</p>'; return; }
    const carpets = STATE.karpet.filter(k => normalize(getField(k, ['INV NO','INV_NO'])) === normalize(inv));
    if (!carpets.length) { container.innerHTML = '<p class="muted">Tiada karpet untuk invois ini.</p>'; return; }

    const order = STATE.tempahan.find(o => normalize(getField(o, ['INV NO','INV_NO','NO INVOIS'])) === normalize(inv)) || {};
    const cust = STATE.pelanggan.find(c => String(getField(c, ['CUSTOMER ID','CUSTOMER_ID'])) === String(getField(order, ['CUSTOMER ID','CUSTOMER_ID']))) || {};
    const telefon = String(getField(cust, ['TELEFON','NO TELEFON'], '')).replace(/[- ]/g, '');
    const cusId = getField(cust, ['CUSTOMER ID','CUSTOMER_ID'], '');
    const nama = getField(cust, ['NAMA'], '');
    const alamat = getField(cust, ['ALAMAT'], '');

    const carpetsData = carpets.map(k => {
        return {
            qrId: String(getField(k, ['QR ID','QR_ID'], '')).trim(),
            kod: String(getField(k, ['KOD'], '')).trim()
        };
    });

    let stikersHTML = '';
    carpetsData.forEach((k, idx) => {
        // PERUBAHAN UKURAN: Lebar disetkan kepada 50mm mengikut spesifikasi saiz gulungan kertas thermal baharu anda
        stikersHTML += `
            <div class="stiker-box" style="width:50mm;height:30mm;border:1px dashed #000;padding:1.5mm 1mm;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;text-align:center;font-family:'Inter',sans-serif;margin:1mm;page-break-after:always;background:#fff;">
                <div style="font-size:8px;font-weight:bold;letter-spacing:0.2px;color:#333;">MYCARPET PRO v3.3</div>
                <div style="font-size:8px;font-weight:bold;margin:0.5px 0;">INV: ${escapeHtml(inv)}</div>
                <div class="qr-placeholder" id="qr-stiker-${idx}" style="width:100%;height:13mm;display:flex;align-items:center;justify-content:center;"></div>
                <div style="font-size:7px;font-weight:bold;font-family:monospace;letter-spacing:0.5px;">QR ID: ${escapeHtml(k.qrId)}</div>
                <div style="font-size:6px;border-top:0.5px solid #000;padding-top:1px;font-weight:bold;color:#111;white-space:nowrap;">KOD: ${escapeHtml(k.kod)} | CUS: ${escapeHtml(cusId)} | TEL: ${escapeHtml(telefon)}</div>
            </div>`;
    });

    const html = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3mm;">
            <div><strong>${escapeHtml(inv)}</strong> — ${escapeHtml(nama)}<br><small>${escapeHtml(alamat)} | Tel: ${escapeHtml(telefon)}</small><br><small>Jumlah karpet: ${carpets.length}</small></div>
            <div>
                <button class="btn btn-primary btn-sm" onclick="printStikers()"><i class="fa-solid fa-print"></i> Cetak Semua</button>
                <button class="btn btn-secondary btn-sm" onclick="simpanPDFStikers()"><i class="fa-solid fa-file-pdf"></i> Simpan PDF</button>
                <button class="btn btn-secondary btn-sm" onclick="simpanGambarStikers()"><i class="fa-solid fa-image"></i> Simpan Gambar</button>
            </div>
        </div>
        <div id="stikerGrid" style="display:flex;flex-wrap:wrap;gap:2mm;justify-content:center;">${stikersHTML}</div>`;
    container.innerHTML = html;

    setTimeout(() => {
        carpetsData.forEach((k, idx) => {
            const qrContainer = document.getElementById(`qr-stiker-${idx}`);
            if (qrContainer) {
                qrContainer.innerHTML = '';
                try {
                    // Hanya teks k.qrId sahaja yang disuap ke dalam generator QR, tiada URL lagi [1]
                    new QRCode(qrContainer, {
                        text: k.qrId, 
                        width: 120,
                        height: 120,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.L
                    });

                    const qrImg = qrContainer.querySelector('img');
                    if (qrImg) {
                        qrImg.style.width = '13mm';
                        qrImg.style.height = '13mm';
                        qrImg.style.objectFit = 'contain';
                    }
                } catch (e) {
                    console.error('Gagal jana QR untuk stiker', idx, e);
                }
            }
        });
    }, 100);
}

function printStikers() {
    const grid = document.getElementById('stikerGrid');
    if (!grid) return toast('Tiada stiker.');
    const printWindow = window.open('', '_blank', 'width=800,height=600');
    // PERUBAHAN CSS CETAKAN: Format helaian @page dikemas kini kepada saiz 50mm 30mm
    printWindow.document.write(`<html><head><title>Cetak Stiker Barcode</title><style>*{box-sizing:border-box;margin:0;padding:0;}@page{size:50mm 30mm;margin:0;}body{margin:0;display:flex;flex-wrap:wrap;justify-content:center;background:#fff;}.stiker-box{width:50mm!important;height:30mm!important;margin:0!important;border:none;padding:1.5mm 1mm;display:flex;flex-direction:column;justify-content:space-between;text-align:center;font-family:'Inter',sans-serif;page-break-after:always;background:#fff;box-sizing:border-box;}.stiker-box table, .stiker-box canvas, .stiker-box img {width:13mm!important;height:13mm!important;margin:0 auto!important;object-fit:contain;}.stiker-box div{line-height:1.1!important;}</style></head><body>${grid.innerHTML}</body></html>`);
    printWindow.document.close();
    printWindow.focus();
    setTimeout(() => { printWindow.print(); printWindow.close(); }, 750);
}

function simpanPDFStikers() { printStikers(); }

function simpanGambarStikers() {
    const grid = document.getElementById('stikerGrid');
    if (!grid) return toast('Tiada stiker.');
    if (typeof html2canvas === 'undefined') return toast('Pustaka html2canvas tidak dijumpai.');
    
    html2canvas(grid, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'Stiker_Barcode_50x30.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        toast('Gambar disimpan.');
    });
}

function buildExpenseRows() {
    const data = STATE.rawExpenses || [];
    const now = new Date();
    const currentMM = String(now.getMonth() + 1).padStart(2, '0');
    const currentYYYY = now.getFullYear();
   const filtered = data.filter(item => {
    const t = getField(item, ['TARIKH']);
    if (!t) return false;
    const parts = t.split('/');
    if (parts.length !== 3) return false;
    // PEMBETULAN: Pastikan menggunakan indeks array parts[1] dan parts[2] dengan betul
    return parts[1] === currentMM && parts[2] == currentYYYY;
});

    if (!filtered.length) return '<tr><td colspan="5" class="text-center muted">Tiada rekod bulan ini.</td></tr>';
    filtered.sort((a, b) => (getField(b, ['TARIKH']) || '').localeCompare(getField(a, ['TARIKH']) || ''));
    let rows = '';
    filtered.forEach(item => {
        const id = escapeHtml(getField(item, ['ID'], ''));
        const tgl = escapeHtml(getField(item, ['TARIKH'], '-'));
        const bayar = escapeHtml(getField(item, ['BAYAR_MELALUI'], '-'));
        const jenis = escapeHtml(getField(item, ['JENIS BARANG','JENIS_BARANG','JENIS'], '-'));
        const jumlah = formatMoney(getField(item, ['AMOUNT','JUMLAH'], 0));
        rows += `<tr>
            <td>${tgl}</td>
            <td>${bayar}</td>
            <td>${jenis}</td>
            <td>${jumlah}</td>
            <td>
                <button class="btn btn-secondary btn-sm" onclick="editExpense('${id}')"><i class="fa-solid fa-pen"></i></button>
                <button class="btn btn-danger btn-sm" onclick="deleteExpense('${id}')"><i class="fa-solid fa-trash"></i></button>
            </td>
        </tr>`;
    });
    return rows;
}

function editExpense(id) {
    const item = STATE.rawExpenses.find(x => x.ID === id);
    if (!item) return toast('Rekod tidak dijumpai.');
    document.getElementById('expenseEditId').value = id;
    document.getElementById('expDate').value = item.TARIKH.split('/').reverse().join('-');
    document.getElementById('expBayar').value = item.BAYAR_MELALUI || 'TUNAI';
    document.getElementById('expJenis').value = item['JENIS BARANG'] || '';
    document.getElementById('expQty').value = item.KUANTITI || 1;
    document.getElementById('expPrice').value = item.HARGA_SEUNIT || 0;
    document.getElementById('expButiran').value = item.BUTIRAN || '';
    document.getElementById('expKod').value = item.KOD_PERBELANJAAN || '';
    document.getElementById('expPembekal').value = item.PEMBEKAL || '';
    document.getElementById('expCatatan').value = item.CATATAN || '';
    kiraAmount();
    document.getElementById('expenseMsg').innerHTML = '<span class="badge badge-proses">Sedang mengedit rekod...</span>';
    document.getElementById('expenseFormContainer').scrollIntoView({ behavior: 'smooth' });
}

function deleteExpense(id) {
    if (!confirm('Pastikan padam rekod ini?')) return;
    showLoading(true);
    postData({ action: 'deleteExpense', id: id }).then(() => {
        showLoading(false);
        toast('Rekod dipadam.');
        fetchData(() => renderExpenses(document.getElementById('tabContainer')), true);
    }).catch(() => {
        showLoading(false);
        toast('Gagal memadam.');
    });
}

function simpanPerbelanjaan() {
    const tarikhISO = document.getElementById('expDate').value;
    if (!tarikhISO) { showPriceMsg('expenseMsg', '❌ Sila pilih tarikh.', 'error'); return; }
    const [tahun, bulan, hari] = tarikhISO.split('-');
    const tarikhDDMMYYYY = `${hari}/${bulan}/${tahun}`;
    const bayar = document.getElementById('expBayar').value;
    const jenis = document.getElementById('expJenis').value.trim();
    const kod = document.getElementById('expKod').value;
    const qty = parseInt(document.getElementById('expQty').value) || 0;
    const price = getNumber(document.getElementById('expPrice').value);
    const amount = qty * price;
    const butiran = document.getElementById('expButiran').value.trim();
    const pembekal = document.getElementById('expPembekal').value.trim();
    const catatan = document.getElementById('expCatatan').value.trim();
    const editId = document.getElementById('expenseEditId').value;
    if (!jenis || amount <= 0) {
        showPriceMsg('expenseMsg', '❌ Sila isi Jenis Barang dan pastikan Jumlah > 0.', 'error');
        return;
    }
    const payload = {
        tarikh: tarikhDDMMYYYY,
        bayar: bayar,
        jenis: jenis,
        kuantiti: qty,
        hargaSeunit: price,
        butiran: butiran,
        kod: kod,
        pembekal: pembekal,
        catatan: catatan,
        amount: amount,
        gabungan: ''
    };
    showLoading(true);
    let action = 'addOperationalExpense';
    if (editId) {
        action = 'updateExpense';
        payload.id = editId;
    }
    postData({ action: action, ...payload }).then(() => {
        showLoading(false);
        toast(editId ? '✅ Perbelanjaan dikemaskini!' : '✅ Perbelanjaan direkodkan!');
        document.getElementById('expenseEditId').value = '';
        document.getElementById('expJenis').value = '';
        document.getElementById('expQty').value = '1';
        document.getElementById('expPrice').value = '0.00';
        document.getElementById('expAmount').value = '';
        document.getElementById('expButiran').value = '';
        document.getElementById('expPembekal').value = '';
        document.getElementById('expCatatan').value = '';
        document.getElementById('expenseMsg').innerHTML = '';
        kiraAmount();
        fetchData(function() {
            renderExpenses(document.getElementById('tabContainer'));
        }, false);
    }).catch(() => {
        showLoading(false);
        showPriceMsg('expenseMsg', '❌ Gagal simpan.', 'error');
    });
}

function bukaScannerResitPerbelanjaan() {
    const previewContainer = document.getElementById('perbelanjaanScannerContainer');
    const statusText = document.getElementById('statusOcr');
    
    if (typeof closeQRScanner === 'function') closeQRScanner();
    if (typeof tutupScannerCepatDashboard === 'function') tutupScannerCepatDashboard();
    if (html5QrCodeInstance) {
        try { html5QrCodeInstance.stop(); } catch(e){}
        html5QrCodeInstance = null;
    }
    
    previewContainer.style.display = 'block';
    statusText.innerText = 'Menghidupkan kamera live...';

    html5QrCodeInstance = new Html5Qrcode("perbelanjaan-qr-reader");
    
    const config = {
        fps: 20,
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0
    };

    html5QrCodeInstance.start(
        { facingMode: "environment" },
        config,
        onScanSuccessPerbelanjaan,
        (err) => {}
    ).then(() => {
        statusText.innerText = 'Halakan kamera tepat pada QR/Barcode resit bil...';
        previewContainer.scrollIntoView({ behavior: 'smooth' });
    }).catch(err => {
        statusText.innerText = 'Gagal akses live kamera: ' + err;
        previewContainer.style.display = 'none';
        html5QrCodeInstance = null;
    });
}

function onScanSuccessPerbelanjaan(decodedText, decodedResult) {
    const statusText = document.getElementById('statusOcr');
    const scannedData = decodedText.trim();
    
    console.log("Data Resit Berjaya Diimbas:", scannedData);

    const inputResit = document.getElementById('expButiran');
    if (inputResit) {

function tutupScannerResitPerbelanjaan() {
    if (html5QrCodeInstance) {
        try {
            html5QrCodeInstance.stop().then(() => {
                html5QrCodeInstance.clear();
                html5QrCodeInstance = null;
            }).catch(() => {});
        } catch(e) {}
    }
    const previewContainer = document.getElementById('perbelanjaanScannerContainer');
    if (previewContainer) previewContainer.style.display = 'none';
    const statusText = document.getElementById('statusOcr');
    if (statusText && statusText.innerText.includes('Halakan kamera')) statusText.innerText = '';
}

async function prosesOcrResit(event) {
    const file = event.target.files[0];
    if (!file) return;
    const statusEl = document.getElementById('statusOcr');
    statusEl.innerText = "🔄 AI sedang membaca resit...";
    try {
        const compressedBlob = await compressImage(file, 1080, 1080, 0.8);
        const compressedFile = new File([compressedBlob], file.name, { type: 'image/jpeg' });
        const result = await Tesseract.recognize(compressedFile, 'msa+eng', { logger: m => console.log(m) });
        const text = result.data.text;
        console.log("OCR text:", text);

        let dateFound = null;
        const dateRegexes = [
            /(\d{2})\/(\d{2})\/(\d{4})/,
            /(\d{2})-(\d{2})-(\d{4})/,
            /(\d{4})-(\d{2})-(\d{2})/,
            /(\d{2})\/(\d{2})\/(\d{2})/
        ];
        for (let regex of dateRegexes) {
            const match = text.match(regex);
            if (match) {
                let y = match[3];
                if (y.length === 2) y = '20' + y;
                let m = match[2], d = match[1];
                if (m.length === 1) m = '0' + m;
                if (d.length === 1) d = '0' + d;
                dateFound = y + '-' + m + '-' + d;
                break;
            }
        }
        if (dateFound) {
            document.getElementById('expDate').value = dateFound;
        }

        const supplierMatch = text.match(/(?:Kedai|Supplier|Pembekal)[:\s]*([^\n\r]+)/i);
        if (supplierMatch) {
            document.getElementById('expPembekal').value = supplierMatch[1].trim();
        }

        const amountMatch = text.match(/(?:RM|TOTAL|JUMLAH)[\s:]*([\d.,]+)/i);
        if (amountMatch && amountMatch[1]) {
            let amount = amountMatch[1].replace(',', '');
            document.getElementById('expPrice').value = parseFloat(amount).toFixed(2);
            kiraAmount();
            statusEl.innerText = `✅ RM ${amount} dikesan. Sila semak.`;
        } else {
            statusEl.innerText = "⚠️ Gagal mengesan jumlah RM secara automatik.";
        }
    } catch (error) {
        console.error(error);
        statusEl.innerText = "❌ Gagal memproses gambar resit.";
    }
}

function compressImage(file, maxWidth = 1080, maxHeight = 1080, quality = 0.8) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                if (width > height) {
                    if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                } else {
                    if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

function generateInvoiceNumber() {
    const now = new Date();
    const yy = String(now.getFullYear()).slice(-2);
    const mm = ('0' + (now.getMonth() + 1)).slice(-2);
    const dd = ('0' + now.getDate()).slice(-2);
    const prefix = yy + mm + dd;
    let maxSeq = 499;
    STATE.tempahan.forEach(t => {
        const inv = getField(t, ['INV NO','INV_NO','NO INVOIS']).toString().trim();
        if (inv.startsWith('INV')) {
            const suffix = parseInt(inv.slice(-4), 10);
            if (!isNaN(suffix) && suffix > maxSeq) {
                maxSeq = suffix;
            }
        }
    });
    const nextSeq = maxSeq + 1;
    return 'INV' + prefix + nextSeq;
}
