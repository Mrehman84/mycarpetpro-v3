<!DOCTYPE html>
<html lang="ms">
<head>
    <link rel="icon" type="image/png" href="icon-512.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYCARPET PRO v3.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary-red: #ff4b4b;
            --primary-dark: #1e1e2f;
            --sidebar-width: 270px;
            --bg-light: #f8f9fa;
            --text-dark: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --success: #2ecc71;
            --warning: #f1c40f;
            --info: #3498db;
            --radius: 10px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,.10), 0 2px 4px -1px rgba(0,0,0,.06);
            --orange: #ff6d00;
            --green: #28a745;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-light); color: var(--text-dark); min-height: 100vh; }
        #loadingOverlay {
            position: fixed; inset: 0; background: rgba(255,255,255,.92); z-index: 9999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        #loadingOverlay.active { display: flex; }
        .spinner {
            width: 50px; height: 50px; border: 5px solid var(--border-color);
            border-top-color: var(--primary-red); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .login-screen {
            position: fixed; inset: 0; background: linear-gradient(135deg, #1e1e2f 0%, #2d2d44 100%);
            display: flex; align-items: center; justify-content: center; z-index: 10000;
        }
        .login-card {
            background: #fff; border-radius: 16px; padding: 40px 30px;
            width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .login-logo { height: 60px; margin-bottom: 10px; }
        .login-card h2 { font-size: 24px; font-weight: 700; color: var(--primary-dark); }
        .login-tabs {
            display: flex; margin: 20px 0; border-radius: 30px; overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .login-tab {
            flex: 1; padding: 10px; background: #f7fafc; border: none;
            cursor: pointer; font-weight: 600; font-size: 14px; transition: .2s;
        }
        .login-tab.active { background: var(--primary-red); color: #fff; }
        .login-form { display: none; }
        .login-form.active { display: block; }
        .login-form .form-group { margin-bottom: 16px; text-align: left; }
        .login-error {
            background: #ffe0e0; color: #c00; padding: 10px;
            border-radius: 6px; font-size: 13px; margin-top: 12px;
        }
        .app-container { display: flex; min-height: 100vh; }
        .app-container.hidden { display: none; }
        aside {
            width: var(--sidebar-width); background: var(--primary-dark); color: #fff;
            position: fixed; top: 0; bottom: 0; left: 0;
            display: flex; flex-direction: column; z-index: 100;
            transition: transform .3s; overflow-y: auto;
        }
        .sidebar-brand {
            padding: 24px 20px; font-size: 20px; font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,.1);
            display: flex; align-items: center; gap: 10px; color: var(--primary-red);
        }
        .sidebar-brand span { color: #fff; }
        .sidebar-brand .brand-red { color: var(--primary-red); }
        .sidebar-menu {
            list-style: none; padding: 16px 12px; display: flex;
            flex-direction: column; gap: 4px; flex: 1;
        }
        .menu-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; color: #a0aec0; text-decoration: none;
            border-radius: var(--radius); font-weight: 500; cursor: pointer;
            transition: .2s; font-size: 14px;
        }
        .menu-item i { width: 22px; font-size: 16px; text-align: center; }
        .menu-item:hover { background: rgba(255,255,255,.08); color: #fff; }
        .menu-item.active { background: var(--primary-red); color: #fff; }
        .sidebar-footer { padding: 16px 12px; border-top: 1px solid rgba(255,255,255,.1); }
        main {
            margin-left: var(--sidebar-width); flex: 1; padding: 30px;
            width: calc(100% - var(--sidebar-width)); transition: .3s;
        }
        .card {
            background: #fff; border-radius: var(--radius); padding: 24px;
            box-shadow: var(--shadow); margin-bottom: 24px; border: 1px solid var(--border-color);
        }
        .card-title {
            font-size: 18px; font-weight: 600; margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color); padding-bottom: 10px;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        .form-control {
            width: 100%; padding: 10px 14px; border: 1px solid var(--border-color);
            border-radius: var(--radius); font-size: 14px; outline: none;
            background: #fff; transition: border-color .2s;
        }
        .form-control:focus { border-color: var(--primary-red); }
        .row { display: flex; gap: 20px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 200px; }
        .btn {
            padding: 10px 20px; border: none; border-radius: var(--radius);
            font-weight: 600; cursor: pointer; display: inline-flex;
            align-items: center; justify-content: center; gap: 8px;
            font-size: 14px; transition: .2s; text-decoration: none;
        }
        .btn:hover { opacity: .85; transform: translateY(-1px); }
        .btn-primary { background: var(--primary-red); color: #fff; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-danger { background: #e53e3e; color: #fff; }
        .btn-whatsapp { background: #25D366; color: #fff; }
        .btn-secondary { background: #e2e8f0; color: var(--text-dark); }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .w-full { width: 100%; }
        .hidden { display: none !important; }
        .muted { color: var(--text-muted); }
        .text-center { text-align: center; }
        .mt-16 { margin-top: 16px; }
        .flex { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .metrics-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
            gap: 18px; margin-bottom: 30px;
        }
        .metric-card {
            background: #fff; padding: 20px; border-radius: var(--radius);
            box-shadow: var(--shadow); border-left: 5px solid var(--primary-red);
        }
        .metric-card h3 { font-size: 13px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
        .metric-card p { font-size: 28px; font-weight: 700; }
        .badge {
            padding: 4px 12px; border-radius: 20px; font-size: 11px;
            font-weight: 600; text-transform: uppercase; display: inline-block;
        }
        .badge-proses { background: #ffeeb2; color: #8a6500; }
        .badge-cuci { background: #ebf8ff; color: #2b6cb0; }
        .badge-ready { background: #e6fffa; color: #234e52; }
        .badge-selesai { background: #c6f6d5; color: #22543d; }
        .table-wrap { overflow-x: auto; }
        .data-table {
            width: 100%; border-collapse: collapse; font-size: 14px; min-width: 600px;
        }
        .data-table th {
            padding: 10px 12px; border-bottom: 2px solid var(--border-color);
            color: var(--text-muted); text-align: left; font-weight: 600;
        }
        .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        .data-table tr:hover { background: #f7fafc; }
        .wa-preview {
            background: #dcf8c6; padding: 16px; border-radius: var(--radius);
            white-space: pre-wrap; font-family: 'Segoe UI', sans-serif;
            font-size: 14px; line-height: 1.6; margin-top: 12px;
            border: 1px solid #b7d7a8;
        }
        .toast-container {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; gap: 8px; z-index: 99999;
        }
        .toast {
            background: #333; color: #fff; padding: 12px 24px;
            border-radius: 30px; font-size: 14px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            animation: fadeInUp 0.3s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .mobile-menu { display: none; }
        @media (max-width: 992px) {
            aside { transform: translateX(-100%); }
            body.sidebar-open aside { transform: translateX(0); }
            main { margin-left: 0; width: 100%; padding: 16px; }
            .mobile-menu { display: inline-flex; }
            .row { flex-direction: column; }
            .col { min-width: 0; }
            .metrics-grid { grid-template-columns: repeat(2,1fr); }
        }
        @media (max-width: 600px) {
            .metrics-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div id="loadingOverlay"><div class="spinner"></div><p style="margin-top:15px;font-weight:500;color:var(--text-muted)">Memuat data...</p></div>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
    <div class="login-card">
        
        <img src="icon-512.png" alt="Logo" class="login-logo">

        <h2>MYCARPET PRO v3.0</h2>
        <p class="muted">Sistem Pengurusan Cucian Karpet</p>
        <div class="login-tabs">
            <button class="login-tab active" data-role="admin">Admin</button>
            <button class="login-tab" data-role="customer">Pelanggan</button>
        </div>
        <form id="loginFormAdmin" class="login-form active">
            <div class="form-group"><label>Username</label><input type="text" id="adminUser" class="form-control" placeholder="admin" autocomplete="username"></div>
            <div class="form-group"><label>Password</label><input type="password" id="adminPass" class="form-control" placeholder="••••••" autocomplete="current-password"></div>
            <div class="form-group flex"><label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="rememberMeAdmin"> Ingat Saya</label></div>
            <button type="button" class="btn btn-primary w-full" onclick="loginAdmin()"><i class="fa-solid fa-lock-open"></i> Log Masuk</button>
        </form>
        <form id="loginFormCustomer" class="login-form">
            <div class="form-group"><label>Nombor Telefon</label><input type="tel" id="custPhone" class="form-control" placeholder="60123456789"></div>
            <div class="form-group flex"><label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="rememberMeCust"> Ingat Saya</label></div>
            <button type="button" class="btn btn-success w-full" onclick="loginCustomer()"><i class="fa-solid fa-user-check"></i> Semak Status</button>
        </form>
        <div id="loginError" class="login-error hidden"></div>
    </div>
</div>

<!-- APP -->
<div id="appContainer" class="app-container hidden">
    <aside id="sidebar">
        <div class="sidebar-brand"><i class="fa-solid fa-rug"></i><span>MYCARPET<span class="brand-red">PRO</span></span></div>
        <ul id="sidebarMenu" class="sidebar-menu"></ul>
        <div class="sidebar-footer"><div class="menu-item" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Log Keluar</div></div>
    </aside>
    <main>
        <button class="btn btn-secondary mobile-menu" onclick="toggleSidebar()" style="margin-bottom:15px;"><i class="fa-solid fa-bars"></i> Menu</button>
        <div id="tabContainer"></div>
    </main>
</div>
<div id="toastContainer" class="toast-container"></div>

<script>
// ==================== CONFIG & STATE ====================
const CONFIG = {
    GAS_API_URL: "https://script.google.com/macros/s/AKfycbxwVCPXKwUz647g6oGlCQRtM2sgMGKvB2fBEp-E8niCHzAHJjJm-L_7XoQS97BuMyJ3/exec",
    FINANCE_GAS_URL: "https://script.google.com/macros/s/AKfycbyJ2T-3MApoYIAjwLcOo4xLHV2h6CGzOOGmCkMa8J-17jhmh2n3UBp7_jhhoIeJzhO8oA/exec",
    ACTIVE_STATUSES: ["DALAM PROSES", "PENGERINGAN", "READY TO DELIVER", "SELESAI DIHANTAR"]
};
let STATE = {
    senaraiHarga: [], pelanggan: [], tempahan: [], karpet: [], payment: [],
    pekerja: [], komisen: [], runnerTugasan: [],expenses: [],rawExpenses: [],
    currentUser: null, isLoading: false, lastCustomer: null, lastOrderMsg: '',
    paymentWhatsAppMsg: '', paymentWhatsAppTel: ''
};

// ==================== HELPERS ====================
function $(s, c=document) { return c.querySelector(s); }
function $$(s, c=document) { return [...c.querySelectorAll(s)]; }
function getField(row, names, fallback="") {
    if (!row || typeof row !== 'object') return fallback;
    const norm = names.map(n => String(n).toUpperCase().trim());
    for (let key of Object.keys(row)) {
        if (norm.includes(String(key).toUpperCase().trim())) {
            const v = row[key];
            return (v !== undefined && v !== null) ? v : fallback;
        }
    }
    return fallback;
}
function getNumber(v) {
    const n = parseFloat(String(v || "0").replace(/[RM,]/g, '').trim());
    return isNaN(n) ? 0 : n;
}
function formatMoney(v) { return "RM " + getNumber(v).toFixed(2); }
function escapeHtml(t) { if (!t) return ''; return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function normalize(s) { return String(s || "").trim().toUpperCase(); }
function showLoading(show) { const el = $('#loadingOverlay'); if (el) el.classList.toggle('active', show); }
function getToday() { return new Date().toISOString().split('T')[0]; }
function addDays(date, days) { const d = new Date(date); d.setDate(d.getDate() + days); return d.toISOString().split('T')[0]; }
function formatDateMY(dateStr) {
    if (!dateStr) return '-';
    const parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr;
    return `${parts[2]}-${parts[1]}-${parts[0]}`;
}
function toast(msg) {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const div = document.createElement('div'); div.className = 'toast'; div.textContent = msg;
    container.appendChild(div);
    setTimeout(() => div.remove(), 3000);
}

// ==================== API ====================
function fetchData(callback, skipRefresh = false) {
    if (STATE.isLoading) return;
    STATE.isLoading = true;
    showLoading(true);
    $$('script[data-jsonp]').forEach(el => el.remove());
    const cbName = 'jsonp_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);
    const timeout = setTimeout(() => {
        cleanupJsonp(cbName); showLoading(false); STATE.isLoading = false;
        toast('Masa muat turun tamat.');
    }, 25000);
    window[cbName] = function(resp) {
        clearTimeout(timeout);
        STATE.isLoading = false;
        showLoading(false);
        try {
            if (resp && typeof resp === 'object') {
                STATE.senaraiHarga = Array.isArray(resp.senaraiHarga) ? resp.senaraiHarga : [];
                STATE.pelanggan = Array.isArray(resp.pelanggan) ? resp.pelanggan : [];
                STATE.tempahan = Array.isArray(resp.tempahan) ? resp.tempahan : [];
                STATE.karpet = Array.isArray(resp.karpet) ? resp.karpet : [];
                STATE.payment = Array.isArray(resp.payment) ? resp.payment : [];
                STATE.pekerja = Array.isArray(resp.pekerja) ? resp.pekerja : [];
                STATE.komisen = Array.isArray(resp.komisen) ? resp.komisen : [];
                STATE.runnerTugasan = Array.isArray(resp.runnerTugasan) ? resp.runnerTugasan : [];
                STATE.expenses = Array.isArray(resp.Raw_Expenses) ? resp.Raw_Expenses : [];
                STATE.rawExpenses = STATE.expenses;

                if (callback) callback();
                if (!skipRefresh) refreshAllUI();
            } else { toast('Data tidak sah.'); }
        } catch(e) { console.error(e); toast('Ralat memproses data.'); }
        finally { cleanupJsonp(cbName); }
    };
    const script = document.createElement('script');
    script.id = cbName; script.dataset.jsonp = 'true';
    script.src = CONFIG.GAS_API_URL + '?action=readAll&callback=' + encodeURIComponent(cbName);
    script.onerror = function() {
        clearTimeout(timeout); showLoading(false); STATE.isLoading = false;
        cleanupJsonp(cbName); toast('Gagal hubungi GAS.');
    };
    document.body.appendChild(script);
}


async function postData(data) {
    try {
        await fetch(CONFIG.GAS_API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)       // ← WAJIB JSON body
        });
        return { success: true };
    } catch (e) {
        console.error(e);
        toast('Gagal menghantar data.');
        return { success: false };
    }
}

function cleanupJsonp(name) { const el = document.getElementById(name); if (el) el.remove(); try { delete window[name]; } catch(e) {} }

// ==================== AUTH ====================
const ADMIN_DUMMY = { username: 'Carpet2026', password: 'Carpet2026', nama: 'Admin MyCarpet' };
function loginAdmin() {
    const username = document.getElementById('adminUser').value.trim();
    const password = document.getElementById('adminPass').value.trim();
    if (!username || !password) { showLoginError('Sila isi username dan password.'); return; }
    if (username === ADMIN_DUMMY.username && password === ADMIN_DUMMY.password) {
        STATE.currentUser = { role: 'admin', username: username, nama: ADMIN_DUMMY.nama };
        saveSession(); afterLogin();
    } else { showLoginError('Username atau password salah.'); }
}
function loginCustomer() {
    const phone = document.getElementById('custPhone').value.trim().replace(/[- ]/g, '');
    if (!phone) { showLoginError('Sila masukkan nombor telefon.'); return; }
    const cust = STATE.pelanggan.find(c => {
        const dbPhone = String(getField(c, ['TELEFON','NO TELEFON'])).replace(/[- ]/g, '');
        return normalize(dbPhone) === normalize(phone);
    });
    if (cust) {
        STATE.currentUser = { role: 'customer', customerId: getField(cust, ['CUSTOMER ID','CUSTOMER_ID']), telefon: phone };
        saveSession(); afterLogin();
    } else { showLoginError('Nombor telefon tidak dijumpai. Sila daftar di kedai.'); }
}
function saveSession() {
    const remember = STATE.currentUser.role === 'admin' ?
        document.getElementById('rememberMeAdmin').checked : document.getElementById('rememberMeCust').checked;
    const storage = remember ? localStorage : sessionStorage;
    storage.setItem('mycarpet_user', JSON.stringify(STATE.currentUser));
}
function showLoginError(msg) { const el = document.getElementById('loginError'); el.textContent = msg; el.classList.remove('hidden'); }
function afterLogin() { document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('appContainer').classList.remove('hidden'); initApp(); }
function logout() {
    STATE.currentUser = null;
    localStorage.removeItem('mycarpet_user'); sessionStorage.removeItem('mycarpet_user');
    document.getElementById('appContainer').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('adminUser').value = '';
    document.getElementById('adminPass').value = '';
    document.getElementById('custPhone').value = '';
    document.getElementById('loginError').classList.add('hidden');
}

// ==================== APP INIT ====================
function initApp() {
    renderSidebar();
    fetchData(() => {
        const defaultTab = STATE.currentUser.role === 'admin' ? 'dashboard' : 'customer-portal';
        switchTab(defaultTab);
    });
}
function renderSidebar() {
    const menuContainer = document.getElementById('sidebarMenu'); menuContainer.innerHTML = '';
    const role = STATE.currentUser.role;
    const menuItems = role === 'admin' ? [
        { id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard' },
        { id: 'temujanji', icon: 'fa-calendar-check', label: 'Temujanji' },
        { id: 'tempahan', icon: 'fa-file-invoice-dollar', label: 'Tempahan Baru' },
        { id: 'tracking', icon: 'fa-qrcode', label: 'Tracking' },
        { id: 'payment', icon: 'fa-money-bill-wave', label: 'Pembayaran' },
        { id: 'invoice', icon: 'fa-print', label: 'Invois & Resit' },
        { id: 'pelanggan', icon: 'fa-users', label: 'Pelanggan' },
        { id: 'pekerja', icon: 'fa-people-group', label: 'Pekerja' },
        { id: 'pricematrix', icon: 'fa-calculator', label: 'Price Matrix' },
        { id: 'barcode', icon: 'fa-barcode', label: 'Cetak Barcode' },
        { id: 'expenses', icon: 'fa-receipt', label: 'Perbelanjaan' }
    ] : [
        { id: 'customer-portal', icon: 'fa-eye', label: 'Status Karpet Saya' }
    ];
    menuItems.forEach(item => {
        const li = document.createElement('li'); li.className = 'menu-item'; li.dataset.tab = item.id;
        li.innerHTML = `<i class="fa-solid ${item.icon}"></i> ${item.label}`;
        li.addEventListener('click', () => switchTab(item.id));
        menuContainer.appendChild(li);
    });
}
function switchTab(tabId) {
    $$('.menu-item').forEach(el => el.classList.remove('active'));
    const activeMenu = $(`.menu-item[data-tab="${tabId}"]`);
    if (activeMenu) activeMenu.classList.add('active');
    const container = document.getElementById('tabContainer'); container.innerHTML = '';
    if (tabId === 'dashboard') renderDashboard(container);
    else if (tabId === 'customer-portal') renderCustomerPortal(container);
    else if (tabId === 'temujanji') renderTemujanji(container);
    else if (tabId === 'tempahan') renderTempahan(container);
    else if (tabId === 'tracking') renderTracking(container);
    else if (tabId === 'payment') renderPayment(container);
    else if (tabId === 'invoice') renderInvoiceTab(container);
    else if (tabId === 'pelanggan') renderPelanggan(container);
    else if (tabId === 'pekerja') renderPekerja(container);
    else if (tabId === 'pricematrix') renderPriceMatrix(container);
    else if (tabId === 'barcode') renderBarcode(container);
    else if (tabId === 'expenses') renderExpenses(container);
    else container.innerHTML = `<div class="card text-center"><h2>🛠️ Modul Akan Datang</h2><p>${escapeHtml(tabId)} akan dibina.</p></div>`;
    if (window.innerWidth <= 992) document.body.classList.remove('sidebar-open');
}
function refreshAllUI() { if (STATE.currentUser) { const ct = document.querySelector('.menu-item.active'); if (ct) switchTab(ct.dataset.tab); } }

// ==================== DASHBOARD ====================
function renderDashboard(container) {
    const proses = STATE.karpet.filter(k => normalize(getField(k,['STATUS'])) === 'DALAM PROSES').length;
    const kering = STATE.karpet.filter(k => normalize(getField(k,['STATUS'])) === 'PENGERINGAN').length;
    const ready = STATE.karpet.filter(k => normalize(getField(k,['STATUS'])) === 'READY TO DELIVER').length;

function generateInvoiceNumber() {
    const now = new Date();
    const yy = String(now.getFullYear()).slice(-2);
    const mm = ('0' + (now.getMonth() + 1)).slice(-2);
    const prefix = yy + mm;
    let maxSeq = 499;
    STATE.tempahan.forEach(t => {
        const inv = getField(t, ['INV NO','INV_NO','NO INVOIS']).toString().trim();
        if (inv.length === 11 && inv.startsWith('INV' + prefix)) {
            const suffix = parseInt(inv.substring(4), 10);
            if (!isNaN(suffix) && suffix > maxSeq) maxSeq = suffix;
        }
    });
    const nextSeq = ('0000' + (maxSeq + 1)).slice(-4);
    return 'INV' + prefix + nextSeq;
}

async function simpanTempahan() {
    const isBaru = document.querySelector('input[name="custType"]:checked').value === 'baru';
    let custId, custNama, custTel, custAlamat, custDaerah;
    if (isBaru) {
        custNama = document.getElementById('custNamaBaru').value.trim();
        custTel = document.getElementById('custTelBaru').value.trim().replace(/[- ]/g, '');
        custAlamat = document.getElementById('custAlamatBaru').value.trim();
        custDaerah = document.getElementById('custDaerahBaru').value.trim();
        if (!custNama || !custTel || !custAlamat) { toast('Sila lengkapkan maklumat pelanggan baru.'); return; }
        custId = '';
        STATE.lastCustomer = { NAMA: custNama, TELEFON: custTel, ALAMAT: custAlamat, DAERAH: custDaerah };
    } else {
        custId = document.getElementById('optPelanggan').value;
        if (!custId) { toast('Sila pilih pelanggan.'); return; }
        const cust = STATE.pelanggan.find(p => String(getField(p, ['CUSTOMER ID','CUSTOMER_ID'])).trim() === custId);
        if (!cust) { toast('Pelanggan tidak ditemui.'); return; }
        STATE.lastCustomer = cust;
        custTel = getField(cust, ['TELEFON','NO TELEFON'], '');
    }
    const items = []; let valid = true;
    document.querySelectorAll('.card-item-row').forEach(row => {
        const sel = row.querySelector('.select-kod-karpet'); if (!sel || !sel.value) { valid = false; return; }
        const opt = sel.options[sel.selectedIndex];
        const qty = Math.max(1, parseInt(row.querySelector('.inp-qty').value) || 1);
        const harga = parseFloat(opt.dataset.harga) || 0;
        items.push({ kod: sel.value, jenis: opt.dataset.jenis || '', harga, qty, subtotal: qty * harga });
    });
    if (!valid || !items.length) { toast('Pastikan semua kod karpet dipilih.'); return; }
    const total = items.reduce((sum, i) => sum + i.subtotal, 0);
    const today = getToday();
    const tarikhSiap = addDays(today, 7);
    const invNo = generateInvoiceNumber();
    showLoading(true);
    await postData({ action: 'createOrder', invNo, isNewCustomer: isBaru, customer: { id: custId, nama: custNama, telefon: custTel, alamat: custAlamat, daerah: custDaerah }, items, total, tarikhAmbil: today, tarikhSiap });
    showLoading(false);
    toast('Tempahan berjaya disimpan! No Invois: ' + invNo);
    const itemsText = items.map((item, i) => ` ${i+1}. *${item.jenis}* (${item.kod}) x${item.qty} = *${formatMoney(item.subtotal)}*`).join('\n');
    const msg = `🧺 *Pusat Cucian Karpet MyCarpetPro v3.0*\n\nPelanggan yang dihormati, karpet anda telah selamat diambil.\n\n🧾 *No Invoice:* ${invNo}\n📅 Tarikh Ambil: ${formatDateMY(today)}\n📆 Tarikh Siap: ${formatDateMY(tarikhSiap)}\n📦 Jumlah Karpet: ${items.length} keping\n\n📝 *Butiran Jenis Karpet:*\n${itemsText}\n\n💰 *Jumlah Harga:* *${formatMoney(total)}*\n📌 Status: Pickup & Proses Cucian\n\nTerima kasih! 🙏`;
    document.getElementById('tempahanPreview').textContent = msg;
    document.getElementById('tempahanPreview').classList.remove('hidden');
    document.getElementById('tempahanWhatsAppBtn').classList.remove('hidden');
    STATE.lastOrderMsg = msg;
    fetchData(null, true);
}

        if (inv) invSet.add(inv);
    });
    const invoiceOptions = ['<option value="">-- Semua --</option>'];
    invSet.forEach(inv => {
        const order = STATE.tempahan.find(o => normalize(getField(o, ['INV NO','INV_NO','NO INVOIS'])) === normalize(inv)) || {};
        const cust = STATE.pelanggan.find(c => String(getField(c, ['CUSTOMER ID','CUSTOMER_ID'])) === String(getField(order, ['CUSTOMER ID','CUSTOMER_ID']))) || {};
        const alamat = String(getField(cust, ['ALAMAT'], ''));
        invoiceOptions.push(`<option value="${escapeHtml(inv)}">${escapeHtml(inv)} — ${escapeHtml(alamat)}</option>`);
    });
    container.innerHTML = `
        <header><div><h1>Tracking QR</h1><p class="muted">Karpet aktif (kecuali Selesai Dihantar)</p></div></header>
        <div class="card">
            <div class="form-group"><label>Cari No. Invois / Alamat</label><select id="trackingInvoiceSelect" class="form-control">${invoiceOptions.join('')}</select></div>

            <div class="flex-between" style="background:var(--bg-light);padding:12px;border-radius:8px;margin-bottom:16px;"><div><strong id="trackingCheckedCount">0 item dipilih</strong></div><button class="btn btn-primary btn-sm" onclick="submitBatchUpdate()"><i class="fa-solid fa-save"></i> Kemas Kini Pukal</button></div>
            <div class="table-wrap"><table class="data-table" id="trackingTable"><thead><tr><th><input type="checkbox" id="trackingMasterCheck" onchange="toggleSelectAll(this)"></th><th>QR / Invois</th><th>Pelanggan / Alamat</th><th>Jenis</th><th>Harga</th><th>Status</th><th>Rak</th><th>Tindakan</th></tr></thead><tbody id="trackingTableBody"><tr><td colspan="8" class="text-center muted">Tiada data</td></tr></tbody></table></div>
        </div>`;
    document.getElementById('trackingInvoiceSelect').addEventListener('change', executeTrackingSearch);
    document.getElementById('trackingSearchBox').addEventListener('input', executeTrackingSearch);
    executeTrackingSearch();
}
function executeTrackingSearch() {
    const tbody = document.getElementById('trackingTableBody');
    tbody.innerHTML = '';
    const selInv = document.getElementById('trackingInvoiceSelect').value;
    const search = document.getElementById('trackingSearchBox').value.trim().toLowerCase();
    let filtered = STATE.karpet.filter(k => {
        if (!k) return false;
        const st = normalize(getField(k, ['STATUS']));
        if (st === 'SELESAI DIHANTAR') return false;
        const inv = String(getField(k, ['INV NO','INV_NO'], '')).trim();
        const qr = String(getField(k, ['QR ID','QR_ID'], '')).trim();
        if (selInv && normalize(inv) !== normalize(selInv)) return false;
        if (search && !qr.toLowerCase().includes(search) && !inv.toLowerCase().includes(search)) return false;
        return true;
    });
    if (!filtered.length) { tbody.innerHTML = '<tr><td colspan="8" class="text-center muted">Tiada hasil</td></tr>'; updateTrackingCheckedCount(); return; }
    filtered.sort((a,b) => String(getField(b, ['QR ID','QR_ID'])).localeCompare(String(getField(a, ['QR ID','QR_ID']))));
    filtered.forEach(k => {
        const inv = String(getField(k, ['INV NO','INV_NO'])).trim();
        const order = STATE.tempahan.find(o => normalize(getField(o, ['INV NO','INV_NO','NO INVOIS'])) === normalize(inv)) || {};
        const cust = STATE.pelanggan.find(c => String(getField(c, ['CUSTOMER ID','CUSTOMER_ID'])) === String(getField(order, ['CUSTOMER ID','CUSTOMER_ID']))) || {};
        const qr = String(getField(k, ['QR ID','QR_ID'])).trim();
        const st = normalize(getField(k, ['STATUS']));
        const badge = st === 'READY TO DELIVER' ? 'badge-ready' : st === 'PENGERINGAN' ? 'badge-cuci' : 'badge-proses';
        const rak = getField(k, ['RAK'], '');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="checkbox" class="tracking-row-checkbox" value="${escapeHtml(qr)}" onchange="updateTrackingCheckedCount()"></td>
            <td><strong>${escapeHtml(qr)}</strong><br><small>${escapeHtml(inv)}</small></td>
            <td><strong>${escapeHtml(String(getField(cust, ['NAMA'], 'TIADA')))}</strong><br><small>${escapeHtml(String(getField(cust, ['ALAMAT'], '')))}</small></td>
            <td>${escapeHtml(String(getField(k, ['JENIS','JENIS CARPET'])))}</td>
            <td>${formatMoney(getField(k, ['HARGA']))}</td>
            <td><span class="badge ${badge}">${escapeHtml(st)}</span></td>
            <td>${escapeHtml(rak) || '-'}</td>
            <td>
                <button class="btn btn-secondary btn-sm" onclick="updateSingleStatus('${escapeHtml(qr)}')"><i class="fa-solid fa-edit"></i></button>
                ${st === 'READY TO DELIVER' ? `<button class="btn btn-info btn-sm" onclick="assignRak('${escapeHtml(qr)}')"><i class="fa-solid fa-box-archive"></i> Rak</button>` : ''}
            </td>`;
        tbody.appendChild(tr);
    });
    updateTrackingCheckedCount();
}
function assignRak(qrId) {
    const rak = prompt('Masukkan kod rak (contoh: RAK-A1):');
    if (!rak) return;
    const k = STATE.karpet.find(x => String(getField(x, ['QR ID','QR_ID'])).trim() === qrId);
    if (k) k['RAK'] = rak;
    postData({ action: 'updateRak', qrId: qrId, rak: rak }).then(() => {
        toast('Rak disimpan!');
        executeTrackingSearch();
    });
}
function toggleSelectAll(masterCheckbox) {
    document.querySelectorAll('.tracking-row-checkbox').forEach(cb => cb.checked = masterCheckbox.checked);
    updateTrackingCheckedCount();
}
function updateTrackingCheckedCount() {
    document.getElementById('trackingCheckedCount').textContent = `${document.querySelectorAll('.tracking-row-checkbox:checked').length} item dipilih`;
}
function updateSingleStatus(qrId) {
    const k = STATE.karpet.find(x => String(getField(x, ['QR ID','QR_ID'])).trim() === qrId);
    if (!k) return toast('Karpet tidak dijumpai.');
    const cur = normalize(getField(k, ['STATUS']));
    const baru = prompt(`Status semasa: ${cur}\nMasukkan status baru:\nDALAM PROSES\nPENGERINGAN\nREADY TO DELIVER\nSELESAI DIHANTAR`, cur);
    if (!baru) return;
    const norm = normalize(baru);
    if (!CONFIG.ACTIVE_STATUSES.includes(norm)) return toast('Status tidak sah.');
    updateStatuses([qrId], norm);
}
async function submitBatchUpdate() {
    const checkboxes = document.querySelectorAll('.tracking-row-checkbox:checked');
    if (!checkboxes.length) return toast('Pilih sekurang-kurangnya satu item.');
    const ids = Array.from(checkboxes).map(cb => cb.value);
    const status = document.getElementById('batchStatusOpt').value;
    await updateStatuses(ids, status);
}
async function updateStatuses(qrIds, status) {
    showLoading(true);
    await postData({ action: 'updateBatchStatus', qrIds, status });
    showLoading(false);
    toast('Status dikemas kini.');
    const master = document.getElementById('trackingMasterCheck');
    if (master) master.checked = false;
    fetchData(() => executeTrackingSearch(), true);
}

function renderPayment(container) {
    const invList = [];
    STATE.tempahan.forEach(t => {
        const inv = String(getField(t, ['INV NO','INV_NO','NO INVOIS'])).trim();
        if (!inv) return;
        const status = normalize(getField(t, ['STATUS'], 'Pending'));
        const cust = STATE.pelanggan.find(c => String(getField(c, ['CUSTOMER ID','CUSTOMER_ID'])) === String(getField(t, ['CUSTOMER ID','CUSTOMER_ID']))) || {};
        const nama = getField(cust, ['NAMA'], '');
        const alamat = getField(cust, ['ALAMAT'], '');
        invList.push({ inv, status, nama, alamat });
    });
    invList.sort((a, b) => {
        if (a.status === 'PENDING' && b.status !== 'PENDING') return -1;
        if (a.status !== 'PENDING' && b.status === 'PENDING') return 1;
        return b.inv.localeCompare(a.inv);
    });
    const invoiceOptions = invList.map(item => {
        const label = item.status === 'PENDING' ? '⏳ PENDING' : '✅ PAID';
        return `<option value="${escapeHtml(item.inv)}">${escapeHtml(item.inv)} — ${escapeHtml(item.nama)} — ${escapeHtml(item.alamat)} [${label}]</option>`;
    }).join('');

    container.innerHTML = `
        <header><div><h1>Pengurusan Pembayaran</h1><p class="muted">Rekod bayaran pelanggan</p></div></header>
        <div class="card">
            <div class="form-group"><label>Pilih Invois</label><select id="paymentInvoiceSelect" class="form-control" onchange="loadPaymentData()"><option value="">-- Pilih --</option>${invoiceOptions}</select></div>
            <div id="paymentInfo" class="hidden">
                <div class="row"><div class="col form-group"><label>Jumlah Keseluruhan (RM)</label><input id="payTotal" class="form-control" disabled></div><div class="col form-group"><label>Deposit Telah Dibayar (RM)</label><input id="payDeposit" class="form-control" disabled></div><div class="col form-group"><label>Baki (RM)</label><input id="payBalance" class="form-control" disabled style="font-weight:700;color:var(--primary-red);"></div></div>
                <div class="row"><div class="col form-group"><label>Jumlah Bayaran Baru (RM)</label><input type="number" id="payAmount" class="form-control" min="0" step="0.01" placeholder="0.00"></div><div class="col form-group"><label>Kaedah Pembayaran</label><select id="payMethod" class="form-control"><option value="TUNAI">TUNAI (CASH)</option><option value="TRANSFER BANK">TRANSFER BANK</option><option value="DuitNow">DuitNow</option></select></div></div>
                <div class="row"><div class="col form-group"><label>Diskaun / Potongan (RM)</label><input type="number" id="payDiscount" class="form-control" min="0" step="0.01" value="0.00" oninput="loadPaymentData()"></div></div>
                <button class="btn btn-success" onclick="rekodBayaran()"><i class="fa-solid fa-check"></i> Rekod Bayaran</button>
                <div id="paymentHistory" class="mt-16"></div>
                <div id="paymentWhatsAppPreview" class="wa-preview hidden mt-16"></div>
                <div id="paymentWhatsAppBtn" class="hidden mt-16"><button class="btn btn-whatsapp" onclick="hantarWhatsAppPembayaran()"><i class="fa-brands fa-whatsapp"></i> Hantar ke WhatsApp</button></div>
            </div>
        </div>`;
}

function loadPaymentData() {
    const inv = document.getElementById('paymentInvoiceSelect').value;
    const infoDiv = document.getElementById('paymentInfo');
    if (!inv) { infoDiv.classList.add('hidden'); return; }
    infoDiv.classList.remove('hidden');
    const order = STATE.tempahan.find(o => normalize(getField(o, ['INV NO','INV_NO','NO INVOIS'])) === normalize(inv));
    const total = getNumber(getField(order, ['JUMLAH HARGA'], 0));
    const discount = getNumber(document.getElementById('payDiscount')?.value || 0);
    const effectiveTotal = Math.max(0, total - discount);
    let deposit = 0;
    let baki = effectiveTotal;
    const payments = STATE.payment.filter(p => normalize(getField(p, ['INV NO','INV_NO','NO INVOIS'])) === normalize(inv));
    payments.forEach(p => { deposit += getNumber(getField(p, ['AMAUN DIBAYAR','AMOUNT'])); });
    if (payments.length > 0) { const lastP = payments[payments.length - 1]; const lb = getNumber(getField(lastP, ['BAKI'])); if (!isNaN(lb)) baki = lb; }
    else { baki = Math.max(0, effectiveTotal - deposit); }
    document.getElementById('payTotal').value = formatMoney(effectiveTotal);
    document.getElementById('payDeposit').value = formatMoney(deposit);
    document.getElementById('payBalance').value = formatMoney(baki);
    const historyDiv = document.getElementById('paymentHistory');
    if (payments.length) {
        let html = '<strong>Sejarah Bayaran</strong><ul style="list-style:none;padding:0;margin-top:8px;">';
        payments.forEach(p => { html += `<li style="padding:4px 0;border-bottom:1px solid #eee;">${escapeHtml(String(getField(p, ['TARIKH','DATE'], '-')))} — ${formatMoney(getField(p, ['AMAUN DIBAYAR','AMOUNT']))} (${escapeHtml(getField(p, ['KAEDAH PEMBAYARAN','METHOD'], 'TUNAI'))})</li>`; });
        html += '</ul>'; historyDiv.innerHTML = html;
    } else { historyDiv.innerHTML = '<p class="muted">Tiada rekod bayaran.</p>'; }
}

async function rekodBayaran() {
    const inv = document.getElementById('paymentInvoiceSelect').value;
    if (!inv) return toast('Sila pilih invois.');
    const amount = getNumber(document.getElementById('payAmount').value);
    if (amount <= 0) return toast('Masukkan jumlah bayaran yang sah.');
    const method = document.getElementById('payMethod').value;
    const date = getToday();
    const discount = getNumber(document.getElementById('payDiscount')?.value || 0);
    showLoading(true);
    await postData({ action: 'addPayment', invNo: inv, amount, method, date, discount });
    showLoading(false);
    toast('Bayaran direkodkan.');
    document.getElementById('payAmount').value = '';
    const order = STATE.tempahan.find(o => normalize(getField(o, ['INV NO','INV_NO','NO INVOIS'])) === normalize(inv));
    const cust = STATE.pelanggan.find(c => String(getField(c, ['CUSTOMER ID','CUSTOMER_ID'])) === String(getField(order, ['CUSTOMER ID','CUSTOMER_ID']))) || {};
    const tel = String(getField(cust, ['TELEFON','NO TELEFON'], '')).replace(/[- ]/g, '');
    fetchData(() => {
        loadPaymentData();
        const updatedOrder = STATE.tempahan.find(o => normalize(getField(o, ['INV NO','INV_NO','NO INVOIS'])) === normalize(inv));
        if (updatedOrder) {
            let td = 0;
            STATE.payment.forEach(p => { if (normalize(getField(p, ['INV NO','INV_NO','NO INVOIS'])) === normalize(inv)) td += getNumber(getField(p, ['AMAUN DIBAYAR','AMOUNT'])); });
            if (td >= getNumber(getField(updatedOrder, ['JUMLAH HARGA'], 0))) { postData({ action: 'updateOrderStatus', invNo: inv, status: 'PAID' }); }
        }
        const lps = STATE.payment.filter(p => normalize(getField(p, ['INV NO','INV_NO','NO INVOIS'])) === normalize(inv));
        let bt = 0;
        if (lps.length > 0) { bt = getNumber(getField(lps[lps.length - 1], ['BAKI'])); }
        const msg = `🧾 *Pusat Cucian Karpet MyCarpetPro v3.0*\n\nPembayaran anda telah kami terima.\n\n🧾 No Invoice: ${inv}\n💰 Jumlah Dibayar: ${formatMoney(amount)}\n💳 Baki Terkini: ${formatMoney(bt)}\n📅 Tarikh Bayaran: ${formatDateMY(date)}\n💳 Kaedah: ${method}\n\nTerima kasih! 🙏`;
        const pe = document.getElementById('paymentWhatsAppPreview'), wb = document.getElementById('paymentWhatsAppBtn');
        if (pe) { pe.textContent = msg; pe.classList.remove('hidden'); }
        if (wb) wb.classList.remove('hidden');
        STATE.paymentWhatsAppMsg = msg; STATE.paymentWhatsAppTel = tel;
    }, true);
}

function hantarWhatsAppPembayaran() {
    const tel = STATE.paymentWhatsAppTel, msg = STATE.paymentWhatsAppMsg;
    if (!tel) return toast('Nombor telefon tidak dijumpai.');
    if (!msg) return toast('Tiada mesej.');
    window.open(`https://wa.me/60${tel.replace(/^0+/, '')}?text=${encodeURIComponent(msg)}`, '_blank');
}

async function shareInvoiceWithAttachment() {
    const data = STATE.currentInvoiceData;
    if (!data || !data.telefon) { toast('Sila pilih invois dahulu.'); return; }
    const element = document.getElementById('invoicePrintArea');
    if (!element) { toast('Sila pilih invois dahulu.'); return; }
    const isPaid = data.isPaid;
    const fileName = isPaid ? `Invoice_${data.inv}.pdf` : `Invoice_${data.inv}_Pending.png`;
    const mimeType = isPaid ? 'application/pdf' : 'image/png';
    toast('Menyediakan lampiran...');
    let fileBlob;
    try {
        if (isPaid) { const pdfBlob = await html2pdf().set({ margin: [5,5,5,5], filename: fileName, image: { type: 'jpeg', quality: 0.95 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(element).outputPdf('blob'); fileBlob = pdfBlob; }
        else { const canvas = await html2canvas(element, { scale: 2, useCORS: true }); fileBlob = await new Promise(res => canvas.toBlob(res, 'image/png')); }
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([fileBlob], fileName, { type: mimeType })] })) {
            const file = new File([fileBlob], fileName, { type: mimeType });
            await navigator.share({ title: `Invoice ${data.inv}`, text: data.msg, files: [file] });
            toast('Invois berjaya dikongsi!');
            setTimeout(() => { const tel = String(data.telefon).replace(/^0+/, ''); const msg = data.msg; const isMobile = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent); const whatsappUrl = isMobile ? `https://wa.me/60${tel}?text=${encodeURIComponent(msg)}` : `whatsapp://send?phone=60${tel}&text=${encodeURIComponent(msg)}`; window.open(whatsappUrl, '_blank'); }, 800);
            return;
        }
    } catch (err) { console.warn('Web Share gagal atau tidak disokong:', err); }
    try { if (fileBlob) { const url = URL.createObjectURL(fileBlob); const a = document.createElement('a'); a.href = url; a.download = fileName; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); toast('Fail dimuat turun. Sila lampirkan secara manual di WhatsApp.'); } } catch (e) { console.error('Muat turun gagal:', e); toast('Gagal memuat turun fail.'); }
    const tel = String(data.telefon).replace(/^0+/, ''); const msg = data.msg || `Salam ${data.nama}, berikut invois ${data.inv}...`; const isMobile = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent);
    if (isMobile) { window.open(`https://wa.me/60${tel}?text=${encodeURIComponent(msg)}`, '_blank'); }
    else { window.open(`whatsapp://send?phone=60${tel}&text=${encodeURIComponent(msg)}`, '_blank'); setTimeout(() => { window.open(`https://web.whatsapp.com/send?phone=60${tel}&text=${encodeURIComponent(msg)}`, '_blank'); }, 2000); }
}

function renderPelangganList(searchTerm = '') {
    const container = document.getElementById('pelangganListContainer');
    let list = STATE.pelanggan || [];
    if (searchTerm) {
        list = list.filter(c => {
            const nama = String(getField(c, ['NAMA'], '')).toLowerCase();

            return nama.includes(searchTerm) || tel.includes(searchTerm);
        });
    }
    if (!list.length) {
        container.innerHTML = '<p class="muted text-center">Tiada pelanggan.</p>';
        return;
    }
    // Kira mata kesetiaan untuk setiap pelanggan
    const loyaltyMap = {};
    STATE.tempahan.forEach(t => {
        const cid = getField(t, ['CUSTOMER ID','CUSTOMER_ID']);
        if (cid) {
            loyaltyMap[cid] = (loyaltyMap[cid] || 0) + getNumber(getField(t, ['JUMLAH HARGA'], 0));
        }
    });

    let html = `<div class="table-wrap"><table class="data-table">
        <thead><tr><th>Customer ID</th><th>Nama</th><th>Telefon</th><th>Alamat</th><th>Daerah</th><th>Mata</th><th>Tindakan</th></tr></thead>
        <tbody>`;
    list.forEach(c => {
        const id = escapeHtml(getField(c, ['CUSTOMER ID','CUSTOMER_ID'], '-'));
        const nama = escapeHtml(getField(c, ['NAMA'], '-'));
        const tel = escapeHtml(String(getField(c, ['TELEFON','NO TELEFON'], '-')));
        const alamat = escapeHtml(getField(c, ['ALAMAT'], '-'));
        const daerah = escapeHtml(getField(c, ['DAERAH'], '-'));
        const mata = Math.floor(loyaltyMap[id] || 0);
        html += `<tr>
            <td><strong>${id}</strong></td>
            <td>${nama}</td>
            <td>${tel}</td>
            <td>${alamat}</td>
            <td>${daerah}</td>
            <td>${mata} ★</td>
            <td>
                <button class="btn btn-secondary btn-sm" onclick="lihatSejarahPelanggan('${id}')"><i class="fa-solid fa-clock-rotate-left"></i> Sejarah</button>
                <button class="btn btn-secondary btn-sm" onclick="showEditPelanggan('${id}')"><i class="fa-solid fa-pen"></i> Edit</button>
                <button class="btn btn-success btn-sm" onclick="gunaDiskaun('${id}', ${mata})"><i class="fa-solid fa-tags"></i> Guna Diskaun</button>
            </td>
        </tr>`;
    });
    html += '</tbody></table></div>';
    container.innerHTML = html;
}

}

function lihatSejarahPelanggan(customerId) {
    const invList = STATE.tempahan.filter(t => normalize(getField(t, ['CUSTOMER ID','CUSTOMER_ID'])) === normalize(customerId));
    const cust = STATE.pelanggan.find(c => normalize(getField(c, ['CUSTOMER ID','CUSTOMER_ID'])) === normalize(customerId));
    const nama = getField(cust, ['NAMA'], customerId);
    const container = document.getElementById('pelangganHistoryContainer');
    container.classList.remove('hidden');
    if (!invList.length) {
        container.innerHTML = `<h3 class="card-title">Sejarah Invois untuk ${escapeHtml(nama)}</h3><p class="muted">Tiada invois ditemui.</p>`;
        return;
    }
    let rows = '';
    invList.sort((a, b) => String(getField(b, ['INV NO','INV_NO','NO INVOIS'])).localeCompare(String(getField(a, ['INV NO','INV_NO','NO INVOIS']))));
    invList.forEach(t => {
        const inv = escapeHtml(getField(t, ['INV NO','INV_NO','NO INVOIS'], '-'));
        const tarikh = escapeHtml(String(getField(t, ['TARIKH','DATE'], '-')).split('T')[0]);
        const status = normalize(getField(t, ['STATUS'], 'Pending'));
        const badge = status === 'PAID' ? 'badge-selesai' : 'badge-proses';
        const jumlah = formatMoney(getField(t, ['JUMLAH HARGA'], 0));
        rows += `<tr><td><strong>${inv}</strong></td><td>${tarikh}</td><td>${jumlah}</td><td><span class="badge ${badge}">${status}</span></td></tr>`;
    });
    container.innerHTML = `
        <h3 class="card-title">Sejarah Invois untuk ${escapeHtml(nama)} (${escapeHtml(customerId)})</h3>
        <div class="table-wrap"><table class="data-table"><thead><tr><th>Invois</th><th>Tarikh</th><th>Jumlah</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>

    container.scrollIntoView({ behavior: 'smooth' });
}

        const st = normalize(getField(k, ['STATUS']));
        if (st === 'DALAM PROSES') {

            qrOptions += `<option value="${qr}">${qr}</option>`;

    });

    // Kira komisen bulan semasa

    const currentMonth = `${now.getFullYear()}-${('0' + (now.getMonth() + 1)).slice(-2)}`;

function renderBulkPrice(container) {
    const mult = { CK: 1.20, CN: 0.50, CS: 0.50, HP: 1.30, LP: 1.00, CSG: 1.30 };
    container.innerHTML = `
        <h3 class="card-title">🧮 Formula Pengiraan Kos Per Sqft</h3>
        <p class="muted">Masukkan harga darab (RM) bagi setiap kumpulan kod.</p>
        <div class="row" style="margin-bottom:20px;">
            <div class="col form-group"><label>Prefix CK</label><input type="number" id="multCK" class="form-control" value="${mult.CK}" step="0.1" min="0"></div>
            <div class="col form-group"><label>Prefix CN</label><input type="number" id="multCN" class="form-control" value="${mult.CN}" step="0.1" min="0"></div>
            <div class="col form-group"><label>Prefix CS</label><input type="number" id="multCS" class="form-control" value="${mult.CS}" step="0.1" min="0"></div>
            <div class="col form-group"><label>Prefix HP</label><input type="number" id="multHP" class="form-control" value="${mult.HP}" step="0.1" min="0"></div>
            <div class="col form-group"><label>Prefix LP</label><input type="number" id="multLP" class="form-control" value="${mult.LP}" step="0.1" min="0"></div>
            <div class="col form-group"><label>Prefix CSG</label><input type="number" id="multCSG" class="form-control" value="${mult.CSG}" step="0.1" min="0"></div>
        </div>
        <div id="bulkPreviewContainer"></div>
        <button class="btn btn-success mt-16" onclick="saveBulkPrices()"><i class="fa-solid fa-cloud-upload-alt"></i> Sahkan & Kemas Kini Semua Harga</button>
        <div id="bulkPriceMsg" class="mt-16"></div>
    `;

    const extractLuas = (kod) => {
        const match = kod.match(/(\d+)\s*X\s*(\d+)/);
        if (match) return parseFloat(match[1]) * parseFloat(match[2]);
        if (kod.includes('TEBAL')) return 24.0;
        return 0.0;
    };

    const updatePreview = () => {
        const elCK = document.getElementById('multCK');
        if (!elCK) return;
        const mults = {
            CK: parseFloat(elCK.value) || 0, CN: parseFloat(document.getElementById('multCN')?.value) || 0,
            CS: parseFloat(document.getElementById('multCS')?.value) || 0, HP: parseFloat(document.getElementById('multHP')?.value) || 0,
            LP: parseFloat(document.getElementById('multLP')?.value) || 0, CSG: parseFloat(document.getElementById('multCSG')?.value) || 0
        };
        const data = STATE.senaraiHarga || [];
        const previewDiv = document.getElementById('bulkPreviewContainer');
        if (!previewDiv) return;
        let html = '<div class="table-wrap"><table class="data-table"><thead><tr><th>KOD</th><th>JENIS</th><th>HARGA SEMASA</th><th>HARGA BARU (DIKIRA)</th></tr></thead><tbody>';
        data.forEach((item, idx) => {
            const kod = String(getField(item, ['KOD'], '')).toUpperCase().trim();
            const jenis = getField(item, ['JENIS CARPET'], '');
            const hargaSemasa = getNumber(getField(item, ['HARGA OPEN'], 0));
            const luas = extractLuas(kod);
            let multiplier = 1.0;
            const prefixes = ['CSG', 'CK', 'CN', 'CS', 'HP', 'LP'];
            for (const p of prefixes) { if (kod.startsWith(p)) { multiplier = mults[p]; break; } }
            const hargaBaru = luas > 0 ? (luas * multiplier) : hargaSemasa;
            html += `<tr><td><strong>${escapeHtml(kod)}</strong></td><td>${escapeHtml(jenis)}</td><td>${formatMoney(hargaSemasa)}</td><td><input type="number" step="0.01" value="${hargaBaru.toFixed(2)}" data-index="${idx}" data-kod="${escapeHtml(kod)}" class="form-control bulk-input" style="text-align:right;"></td></tr>`;
        });
        html += '</tbody></table></div>';
        previewDiv.innerHTML = html;
    };

    document.querySelectorAll('#multCK, #multCN, #multCS, #multHP, #multLP, #multCSG').forEach(inp => inp.addEventListener('input', updatePreview));
    setTimeout(updatePreview, 50);
}

async function saveBulkPrices() {
    const inputs = document.querySelectorAll('.bulk-input');
    if (inputs.length === 0) return toast('Tiada data harga.');
    const updates = [];
    inputs.forEach(inp => {
        const kod = inp.getAttribute('data-kod');
        const newPrice = parseFloat(inp.value);
        if (!isNaN(newPrice)) { updates.push({ kod, harga: newPrice.toFixed(2) }); }
    });
    if (updates.length === 0) { showPriceMsg('bulkPriceMsg', '❌ Tiada perubahan harga.', 'error'); return; }
    showLoading(true);
    await postData({ action: 'batchUpdateHarga', updates });
    showLoading(false);
    showPriceMsg('bulkPriceMsg', '🎉 Semua harga berjaya dikemas kini!', 'success');
    fetchData(null, true);
    setTimeout(() => renderBulkPrice(document.getElementById('priceTabContent')), 1500);
}

function printStikers() {

}

function simpanPDFStikers() { printStikers(); }

function simpanGambarStikers() {
    const grid = document.getElementById('stikerGrid');

    html2canvas(grid, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'Stiker_Barcode.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        toast('Gambar disimpan.');
    });
}

function buildExpenseRows() {
    const data = STATE.rawExpenses || [];
    // Dapatkan bulan semasa dalam format DD/MM/YYYY -> bulan = MM, tahun = YYYY
    const now = new Date();
    const currentMM = String(now.getMonth() + 1).padStart(2, '0'); // "08"
    const currentYYYY = now.getFullYear(); // 2026

    // Tapis hanya data bulan ini
    const filtered = data.filter(item => {
        if (!item.TARIKH) return false;
        const parts = item.TARIKH.split('/'); // DD/MM/YYYY
        if (parts.length !== 3) return false;
        return parts[1] === currentMM && parts[2] == currentYYYY;
    });

    if (!filtered.length) return '<tr><td colspan="4" class="text-center muted">Tiada rekod bulan ini.</td></tr>';

    filtered.sort((a, b) => (b.TARIKH || '').localeCompare(a.TARIKH || ''));
    let rows = '';
    filtered.forEach(item => {
        const tgl = escapeHtml(item.TARIKH || '-');
        const bayar = escapeHtml(item.BAYAR_MELALUI || '-');
        const jenis = escapeHtml(item['JENIS BARANG'] || '-');
        const jumlah = formatMoney(item.AMOUNT || 0);
        rows += `<tr><td>${tgl}</td><td>${bayar}</td><td>${jenis}</td><td>${jumlah}</td></tr>`;
    });
    return rows;
}
function kiraAmount() {
    const qty = parseInt(document.getElementById('expQty')?.value) || 0;
    const price = getNumber(document.getElementById('expPrice')?.value);
    const amount = qty * price;
    const el = document.getElementById('expAmount');

}

async function tambahExpense() {
    const tarikhISO = document.getElementById('expDate').value;
    if (!tarikhISO) { showPriceMsg('expenseMsg', '❌ Sila pilih tarikh.', 'error'); return; }

    const [tahun, bulan, hari] = tarikhISO.split('-');
    const tarikhDDMMYYYY = `${hari}/${bulan}/${tahun}`;

    const namaBulan = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    const idxBulan = parseInt(bulan, 10) - 1;
    const bulanTahun = namaBulan[idxBulan] + tahun;

    const bayar = document.getElementById('expBayar').value;
    const jenis = document.getElementById('expJenis').value.trim();
    const kod = document.getElementById('expKod').value;
    const qty = parseInt(document.getElementById('expQty').value) || 0;
    const price = getNumber(document.getElementById('expPrice').value);
    const amount = qty * price;
    const butiran = document.getElementById('expButiran').value.trim();
    const pembekal = document.getElementById('expPembekal').value.trim();
    const catatan = document.getElementById('expCatatan').value.trim();

    if (!jenis || amount <= 0) {
        showPriceMsg('expenseMsg', '❌ Sila isi Jenis Barang dan pastikan Jumlah > 0.', 'error');
        return;
    }

    const gabungan = bayar + bulanTahun;

    // Bina objek untuk STATE
    const newRecord = {
        TARIKH: tarikhDDMMYYYY,
        BAYAR_MELALUI: bayar,
        'JENIS BARANG': jenis,
        AMOUNT: amount,
        BUTIRAN: butiran,
        KOD_PERBELANJAAN: kod,
        PEMBEKAL: pembekal,
        CATATAN: catatan
    };

    showLoading(true);
    await postData({
        action: 'addOperationalExpense',
        tarikh: tarikhDDMMYYYY,
        bayar: bayar,
        jenis: jenis,
        kuantiti: qty,
        hargaSeunit: price,
        butiran: butiran,
        kod: kod,
        pembekal: pembekal,
        catatan: catatan,
        amount: amount,
        gabungan: gabungan
    });
    showLoading(false);

    // Terus masukkan rekod ke STATE & segarkan jadual (tanpa fetchData)
    if (!STATE.rawExpenses) STATE.rawExpenses = [];
    STATE.rawExpenses.unshift(newRecord);
    document.getElementById('expenseTableBody').innerHTML = buildExpenseRows();

    showPriceMsg('expenseMsg', '✅ Perbelanjaan direkodkan!', 'success');

    // Kosongkan borang
    document.getElementById('expJenis').value = '';
    document.getElementById('expQty').value = '1';
    document.getElementById('expPrice').value = '0.00';
    document.getElementById('expAmount').value = '';
    document.getElementById('expButiran').value = '';
    document.getElementById('expPembekal').value = '';
    document.getElementById('expCatatan').value = '';
    kiraAmount();
}
